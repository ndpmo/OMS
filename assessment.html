<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>領袖培育評估輸入</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="assessment-page">
    <canvas id="campaignCanvas" aria-hidden="true"></canvas>
    <main class="assessment-shell">
      <a class="back-link" href="index.html#leaders">返回組織圖</a>
      <section class="assessment-card">
        <div class="section-heading">
          <p class="eyebrow">評估輸入</p>
          <h1 id="assessmentName">Staff assessment</h1>
          <p id="assessmentMeta">計劃意願及承諾資料</p>
        </div>

        <form id="programAssessmentForm" class="assessment-form">
          <label>
            是否願意加入計劃
            <select id="willingJoin" required>
              <option value="">請選擇 Y/N</option>
              <option value="Y">Y</option>
              <option value="N">N</option>
            </select>
          </label>

          <label>
            目標晉升層級
            <select id="targetTier" required>
              <option value="">請選擇層級</option>
              <option value="tl">Team Leader 層級 -> 1:6</option>
              <option value="as">AS 層級 -> 1:14</option>
            </select>
          </label>

          <label>
            Offer 差距
            <textarea id="offerGap" rows="3" readonly placeholder="選擇層級後自動計算"></textarea>
          </label>

          <label>
            目標完成日期
            <input id="targetCompletionDate" type="date">
          </label>

          <div class="dialog-actions">
            <a class="secondary-button link-button" href="index.html#leaders">取消</a>
            <button class="primary-button" type="submit">儲存評估</button>
          </div>
        </form>
      </section>
    </main>

    <script src="assessment.js?v=20260512-zh-hant"></script>
  </body>
</html>
