<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Org Chart Planner</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172126;
        --muted: #627078;
        --bg: #f5f3ef;
        --surface: #ffffff;
        --surface-2: #e9f0ee;
        --line: #d7ddd9;
        --line-strong: #b9c5bf;
        --connector: #6e8580;
        --teal: #0f766e;
        --teal-soft: #d9f0ec;
        --coral: #d9654f;
        --coral-soft: #ffe5df;
        --amber: #b98219;
        --amber-soft: #fff1cf;
        --blue: #365f91;
        --blue-soft: #e0ebf7;
        --shadow: 0 18px 50px rgba(35, 44, 41, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 14px clamp(14px, 3vw, 30px);
        border-bottom: 1px solid var(--line);
        background: rgba(245, 243, 239, 0.9);
        backdrop-filter: blur(14px);
      }

      .title-block {
        min-width: 0;
      }

      .title-block h1 {
        margin: 0;
        font-size: clamp(1.25rem, 2.3vw, 2rem);
        line-height: 1.08;
      }

      .title-block p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .btn,
      .icon-btn,
      .segmented button {
        min-height: 38px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        font-weight: 750;
      }

      .btn.primary {
        border-color: #0f766e;
        background: var(--teal);
        color: white;
      }

      .icon-btn {
        width: 38px;
        display: inline-grid;
        place-items: center;
        font-size: 1.05rem;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        min-height: 0;
        transition: grid-template-columns 180ms ease;
      }

      .layout.left-collapsed {
        grid-template-columns: 56px minmax(0, 1fr);
      }

      aside {
        position: sticky;
        top: 67px;
        align-self: start;
        height: calc(100vh - 67px);
        overflow: auto;
        padding: 16px;
        border-right: 1px solid var(--line);
        background: #fbfaf7;
      }

      .side-rail {
        display: none;
      }

      .side-toggle {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-weight: 900;
      }

      .layout.left-collapsed aside {
        overflow: hidden;
        padding: 8px;
      }

      .layout.left-collapsed .side-section {
        display: none;
      }

      .layout.left-collapsed .side-rail {
        display: grid;
        justify-items: center;
        gap: 12px;
      }

      .layout.left-collapsed .side-rail-label {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      .layout:not(.left-collapsed) .side-rail {
        display: block;
        margin-bottom: 12px;
      }

      .layout:not(.left-collapsed) .side-rail-label {
        display: none;
      }

      main {
        min-width: 0;
        padding: 18px clamp(14px, 3vw, 30px) 36px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .side-section {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .side-section + .side-section {
        margin-top: 12px;
      }

      .side-section h2,
      .panel-title h2 {
        margin: 0;
        font-size: 0.98rem;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }

      label {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      select,
      input,
      textarea {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        padding: 8px 10px;
      }

      textarea {
        min-height: 122px;
        resize: vertical;
      }

      .range-row {
        display: grid;
        grid-template-columns: 1fr 42px;
        gap: 10px;
        align-items: center;
      }

      input[type="range"] {
        padding: 0;
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 12px;
      }

      .segmented button {
        padding: 0 8px;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .segmented button.active {
        border-color: var(--blue);
        background: var(--blue-soft);
        color: #173a66;
      }

      .status {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 10px;
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.35;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        margin-top: 4px;
        border-radius: 999px;
        background: var(--amber);
      }

      .status.live .status-dot {
        background: var(--teal);
      }

      .status.error .status-dot {
        background: var(--coral);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .metric {
        min-height: 88px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 850;
        text-transform: uppercase;
      }

      .metric strong {
        display: block;
        margin-top: 8px;
        font-size: clamp(1.55rem, 3vw, 2.35rem);
        line-height: 0.95;
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 14px;
        align-items: start;
        transition: grid-template-columns 180ms ease;
      }

      .content-grid.insights-collapsed {
        grid-template-columns: minmax(0, 1fr) 56px;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .chart-wrap {
        overflow: auto;
        min-height: 520px;
        padding: 16px;
      }

      .org-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 12px;
        align-items: start;
      }

      .brand-band {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
      }

      .brand-band h3 {
        margin: 0 0 10px;
        font-size: 1rem;
      }

      .center-card {
        margin-top: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .center-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-2);
        font-weight: 850;
      }

      .as-list {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .person-card {
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }

      .person-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        background: linear-gradient(90deg, #f7fbfa, #eef6f5);
      }

      .name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-weight: 900;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--teal-soft);
        color: #07564f;
        font-size: 0.72rem;
        font-weight: 900;
        white-space: nowrap;
      }

      .tag.as {
        background: var(--blue-soft);
        color: #173a66;
      }

      .tag.warn {
        background: var(--amber-soft);
        color: #714909;
      }

      .tag.hot {
        background: var(--coral-soft);
        color: #9f2f1e;
      }

      .children {
        display: grid;
        gap: 8px;
        padding: 10px;
      }

      .tl-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
      }

      .tl-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 10px;
        border-bottom: 1px dashed var(--line-strong);
      }

      .therapist-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 9px;
      }

      .org-tree-board {
        display: grid;
        gap: 18px;
        min-width: min(1180px, max-content);
        padding: 4px 4px 28px;
      }

      .org-brand-section,
      .org-center-section,
      .org-as-section,
      .org-tl-section {
        display: grid;
        gap: 12px;
      }

      .org-brand-section {
        justify-items: center;
        min-width: 1080px;
      }

      .org-center-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 14px;
        width: 100%;
      }

      .org-center-section,
      .org-as-section,
      .org-tl-section {
        position: relative;
        align-content: start;
        border: 1px solid rgba(110, 133, 128, 0.24);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.68);
      }

      .org-center-section {
        padding: 14px;
      }

      .org-as-grid,
      .org-tl-grid,
      .org-leaf-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }

      .org-as-section {
        padding: 12px;
        background: rgba(224, 235, 247, 0.34);
      }

      .org-tl-section {
        padding: 10px;
        background: rgba(255, 241, 207, 0.36);
      }

      .org-direct-section {
        background: rgba(255, 241, 207, 0.42);
        border-style: dashed;
      }

      .org-section-head {
        display: flex;
        justify-content: center;
      }

      .org-node {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 5px;
        width: 154px;
        min-height: 76px;
        padding: 10px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 12px 26px rgba(35, 44, 41, 0.08);
        text-align: center;
      }

      .org-node strong {
        overflow-wrap: anywhere;
        font-size: 0.88rem;
        line-height: 1.18;
      }

      .org-node small {
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 850;
        text-transform: uppercase;
      }

      .org-node.brand {
        width: 190px;
        min-height: 84px;
        border-color: #0f766e;
        background: linear-gradient(180deg, #e5f6f3, #fff);
      }

      .org-node.center {
        width: 188px;
        border-color: #97b7b1;
        background: #f7fbfa;
      }

      .org-node.as {
        border-color: #8aa8ca;
        background: var(--blue-soft);
      }

      .org-node.tl {
        border-color: #d3b16e;
        background: var(--amber-soft);
      }

      .org-node.tl.over {
        border-color: #d9654f;
        background: var(--coral-soft);
      }

      .org-node.potential {
        border-color: #e18a21;
        background: #ffe3bd;
        box-shadow: 0 14px 30px rgba(177, 104, 21, 0.16);
      }

      .org-node.as.potential,
      .org-node.tl.potential,
      .org-node.tl.over.potential,
      .org-node.therapist.potential {
        border-color: #e18a21;
        background: #ffe3bd;
      }

      .org-node.direct {
        border-style: dashed;
      }

      .org-node.therapist {
        width: 100%;
        min-width: 132px;
        min-height: 54px;
        padding: 8px;
        background: #fff;
      }

      .org-node.therapist strong {
        font-size: 0.78rem;
      }

      .org-count {
        justify-self: center;
      }

      .org-node-stats {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
      }

      .stat-pill {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 0 7px;
        border-radius: 999px;
        background: #f3f7f5;
        color: #354b45;
        font-size: 0.68rem;
        font-weight: 900;
        white-space: nowrap;
      }

      .stat-pill.sales {
        background: #e8f2ff;
        color: #234d78;
      }

      .stat-pill.acb {
        background: #f8ecd2;
        color: #76500b;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        max-width: 100%;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        font-size: 0.82rem;
        font-weight: 750;
        overflow-wrap: anywhere;
      }

      .lane-board {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 10px;
      }

      .lane {
        min-height: 230px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
      }

      .lane.drag-over {
        outline: 3px solid rgba(15, 118, 110, 0.25);
      }

      .lane-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 10px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .lane-body {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 7px;
        min-height: 176px;
        padding: 10px;
      }

      .draggable {
        cursor: grab;
        user-select: none;
      }

      .draggable:active {
        cursor: grabbing;
      }

      .insight-list {
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .insight-panel.collapsed .insight-list {
        display: none;
      }

      .insight-panel {
        overflow: hidden;
      }

      .insight-panel.collapsed {
        position: sticky;
        top: 84px;
        min-height: 240px;
        box-shadow: none;
      }

      .insight-panel.collapsed .panel-head {
        display: grid;
        justify-items: center;
        gap: 10px;
        min-height: 240px;
        padding: 8px;
        border-bottom: 0;
      }

      .insight-panel.collapsed .panel-title {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        display: grid;
        justify-items: center;
        gap: 8px;
      }

      .insight-panel.collapsed .panel-title p {
        display: none;
      }

      .collapse-btn {
        min-width: 38px;
        min-height: 38px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-weight: 900;
      }

      .insight {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .insight strong {
        display: block;
        margin-bottom: 4px;
        overflow-wrap: anywhere;
      }

      .insight p {
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.4;
      }

      .empty {
        display: grid;
        place-items: center;
        min-height: 260px;
        color: var(--muted);
        text-align: center;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 1050px) {
        .layout,
        .content-grid {
          grid-template-columns: 1fr;
        }

        aside {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .metric-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .topbar {
          grid-template-columns: 1fr;
        }

        .toolbar {
          justify-content: stretch;
        }

        .toolbar .btn {
          flex: 1 1 auto;
          justify-content: center;
        }

        .metric-grid {
          grid-template-columns: 1fr;
        }

        .segmented {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="title-block">
          <h1>Org Chart Planner</h1>
          <p>按 Brand、Center、AS、TL、Therapist 自動生成組織圖同排位方案</p>
        </div>
        <div class="toolbar">
          <button class="btn primary" id="refreshBtn" type="button">↻ 重新讀 Sheet</button>
          <button class="btn" id="printBtn" type="button">⎙ 列印</button>
          <button class="btn" id="exportBtn" type="button">⇩ 匯出 CSV</button>
        </div>
      </header>

      <div class="layout" id="appLayout">
        <aside>
          <div class="side-rail">
            <button class="side-toggle" id="sideToggle" type="button" title="收合 / 展開左側控制">×</button>
            <div class="side-rail-label">Controls</div>
          </div>
          <section class="side-section">
            <h2>資料來源</h2>
            <div class="field">
              <label for="sheetUrl">Google Sheet Link</label>
              <input id="sheetUrl" value="https://docs.google.com/spreadsheets/d/1Hc-U6YnTrFxIfeG_wjwLpbYV-ghR0XGDSjuXGyMtSCg/edit?gid=162962768#gid=162962768">
            </div>
            <div class="field">
              <label for="gidInput">Tab GID</label>
              <input id="gidInput" value="162962768">
            </div>
            <div class="field">
              <div class="status" id="statusBox">
                <span class="status-dot"></span>
                <span id="statusText">準備讀取 30+2 Summary Master 的 B/C/D/E/G/L 欄。</span>
              </div>
            </div>
          </section>

          <section class="side-section">
            <h2>篩選</h2>
            <div class="field">
              <label for="brandFilter">Brand</label>
              <select id="brandFilter"></select>
            </div>
            <div class="field">
              <label for="centerFilter">Center</label>
              <select id="centerFilter"></select>
            </div>
            <div class="field">
              <label for="asFilter">AS</label>
              <select id="asFilter"></select>
            </div>
            <div class="field">
              <label for="searchInput">搜尋人名 / Center</label>
              <input id="searchInput" placeholder="例如 katy.laiky">
            </div>
          </section>

          <section class="side-section">
            <h2>規劃參數</h2>
            <div class="field">
              <label for="tlTarget">TL 理想 Team Size</label>
              <div class="range-row">
                <input id="tlTarget" type="range" min="2" max="10" value="6">
                <strong id="tlTargetValue">1:6</strong>
              </div>
            </div>
            <div class="field">
              <label for="asTarget">AS 理想管理人數</label>
              <div class="range-row">
                <input id="asTarget" type="range" min="8" max="30" value="14">
                <strong id="asTargetValue">1:14</strong>
              </div>
            </div>
            <div class="segmented" role="tablist" aria-label="View mode">
              <button class="active" data-view="chart" type="button">Org Chart</button>
              <button data-view="plan" type="button">Drag Plan</button>
              <button data-view="table" type="button">Table</button>
            </div>
          </section>

          <section class="side-section">
            <h2>手動貼資料</h2>
            <div class="field">
              <label for="pasteBox">貼上 B,C,D,E,G,L,P,T,Y,Z 或 CSV/TSV</label>
              <textarea id="pasteBox" placeholder="Brand,Center,AS NAME,TL NAME,Therapist,Position,High Po,MTD Sales%,ACB Current,ACB Net Change"></textarea>
            </div>
            <div class="field">
              <button class="btn" id="pasteBtn" type="button">套用貼上資料</button>
            </div>
          </section>
        </aside>

        <main>
          <section class="metric-grid" aria-label="Summary">
            <div class="metric"><span>Brands</span><strong id="brandCount">0</strong></div>
            <div class="metric"><span>Centers</span><strong id="centerCount">0</strong></div>
            <div class="metric"><span>AS</span><strong id="asCount">0</strong></div>
            <div class="metric"><span>TL</span><strong id="tlCount">0</strong></div>
            <div class="metric"><span>Therapists</span><strong id="therapistCount">0</strong></div>
          </section>

          <div class="content-grid" id="contentGrid">
            <section class="panel">
              <div class="panel-head">
                <div class="panel-title">
                  <h2 id="mainTitle">Org Chart</h2>
                  <p id="mainSubtitle">按現有 Sheet 層級自動整理。</p>
                </div>
                <button class="icon-btn" id="resetPlanBtn" type="button" title="還原拖拉規劃">↺</button>
              </div>
              <div class="chart-wrap">
                <div id="chartView"></div>
                <div id="planView" class="hidden"></div>
                <div id="tableView" class="hidden"></div>
              </div>
            </section>

            <section class="panel insight-panel" id="insightPanel">
              <div class="panel-head">
                <div class="panel-title">
                  <h2>規劃提示</h2>
                  <p>由現有人數同目標 span 自動計。</p>
                </div>
                <button class="collapse-btn" id="insightToggle" type="button" title="收合 / 展開規劃提示">−</button>
              </div>
              <div class="insight-list" id="insights"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script>
      const DEFAULT_ROWS = [
        ["dermes","D 23-24/F PP (A)","amber.aulk","","amber.aulk","AS/S","","99%","66","0"],
        ["dermes","D 23-24/F PP (A)","katy.laiky","","katy.laiky","AS/S","","154%","98","-1"],
        ["dermes","D 23-24/F PP (A)","katy.laiky","ka.ho","ka.ho","TL","","150%","103","3"],
        ["dermes","D 23-24/F PP (A)","katy.laiky","ka.ho","panda.liu","75000-3","Y","0%","8","8"],
        ["dermes","D 23-24/F PP (A)","katy.laiky","ka.ho","sandy.leung","E1","","165%","48","-1"],
        ["dermes","D 23-24/F PP (A)","katy.laiky","may.huang","may.huang","TL","","168%","107","10"],
        ["dermes","D 23-24/F PP (A)","katy.laiky","may.huang","pinky.leehy","E1","Y","130%","77","-7"],
        ["elyze","E 23-24/F PP (A)","betty.chan","","betty.chan","AS/S","","120%","80","2"],
        ["elyze","E 23-24/F PP (A)","betty.chan","natalie.mak","natalie.mak","TL","","112%","74","1"],
        ["elyze","E 23-24/F PP (A)","betty.chan","natalie.mak","emily.chanyc","100000-2","Y","96%","61","-3"],
        ["elyze","E 23-24/F PP (A)","betty.chan","natalie.mak","kay.wong.kk","E1","","101%","70","0"],
        ["reenex","R 23-24/F PP (A)","manyee.lo","","manyee.lo","AS/S","","108%","91","4"],
        ["reenex","R 23-24/F PP (A)","manyee.lo","kiki.ting","kiki.ting","TL","","103%","69","-2"],
        ["reenex","R 23-24/F PP (A)","manyee.lo","kiki.ting","venus.yu","E1","","88%","44","1"]
      ];

      const state = {
        rawRows: [],
        rows: [],
        currentView: "chart",
        planAssignments: new Map(),
        dataSource: "sample"
      };

      const els = {
        sheetUrl: document.querySelector("#sheetUrl"),
        gidInput: document.querySelector("#gidInput"),
        statusBox: document.querySelector("#statusBox"),
        statusText: document.querySelector("#statusText"),
        refreshBtn: document.querySelector("#refreshBtn"),
        printBtn: document.querySelector("#printBtn"),
        exportBtn: document.querySelector("#exportBtn"),
        brandFilter: document.querySelector("#brandFilter"),
        centerFilter: document.querySelector("#centerFilter"),
        asFilter: document.querySelector("#asFilter"),
        searchInput: document.querySelector("#searchInput"),
        tlTarget: document.querySelector("#tlTarget"),
        tlTargetValue: document.querySelector("#tlTargetValue"),
        asTarget: document.querySelector("#asTarget"),
        asTargetValue: document.querySelector("#asTargetValue"),
        chartView: document.querySelector("#chartView"),
        planView: document.querySelector("#planView"),
        tableView: document.querySelector("#tableView"),
        insights: document.querySelector("#insights"),
        insightPanel: document.querySelector("#insightPanel"),
        insightToggle: document.querySelector("#insightToggle"),
        contentGrid: document.querySelector("#contentGrid"),
        appLayout: document.querySelector("#appLayout"),
        sideToggle: document.querySelector("#sideToggle"),
        mainTitle: document.querySelector("#mainTitle"),
        mainSubtitle: document.querySelector("#mainSubtitle"),
        resetPlanBtn: document.querySelector("#resetPlanBtn"),
        pasteBox: document.querySelector("#pasteBox"),
        pasteBtn: document.querySelector("#pasteBtn")
      };

      function clean(value) {
        return String(value ?? "").trim();
      }

      function valid(value) {
        const text = clean(value);
        return text && text !== "#N/A" && text.toLowerCase() !== "null";
      }

      function rowKey(row) {
        return [row.brand, row.center, row.asName, row.tlName, row.therapist, row.position, row.highPo, row.salesMtd, row.acbCurrent, row.acbNetChange].join("|");
      }

      function escapeHtml(value) {
        return clean(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function setStatus(text, type = "") {
        els.statusBox.className = `status ${type}`.trim();
        els.statusText.textContent = text;
      }

      function normalizeRows(values) {
        const output = [];
        const seen = new Set();
        for (const source of values) {
          const row = {
            brand: clean(source[0]).toLowerCase(),
            center: clean(source[1]),
            asName: clean(source[2]),
            tlName: clean(source[3]),
            therapist: clean(source[4]),
            position: clean(source[5]),
            highPo: clean(source[6]),
            salesMtd: clean(source[7]),
            acbCurrent: clean(source[8]),
            acbNetChange: clean(source[9])
          };
          if (!valid(row.brand) || !valid(row.center) || !valid(row.therapist)) continue;
          if (row.brand === "brand" || row.therapist.toLowerCase() === "therapist") continue;
          if (!valid(row.asName) && !valid(row.tlName)) row.asName = "Unassigned AS";
          const key = rowKey(row);
          if (seen.has(key)) continue;
          seen.add(key);
          output.push(row);
        }
        return output;
      }

      function extractSheetId(url) {
        const match = clean(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
        return match ? match[1] : clean(url);
      }

      function readCell(cell) {
        if (!cell) return "";
        return cell.f ?? cell.v ?? "";
      }

      function pickSourceColumns(row) {
        return [
          row[0],
          row[1],
          row[2],
          row[3],
          row[5],
          row[10],
          row[14],
          row[18],
          row[23],
          row[24]
        ];
      }

      function loadFromGoogleSheet() {
        const id = extractSheetId(els.sheetUrl.value);
        const gid = clean(els.gidInput.value) || "162962768";
        const callback = `__orgChart_${Date.now()}`;
        const src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?gid=${gid}&range=B1:Z260&headers=2&tqx=responseHandler:${callback}`;
        let settled = false;

        setStatus("正在讀取 Google Sheet live data...", "");

        window[callback] = response => {
          settled = true;
          try {
            const rows = (response.table.rows || []).map(row => pickSourceColumns((row.c || []).map(readCell)));
            state.rawRows = normalizeRows(rows);
            state.dataSource = "live";
            if (!state.rawRows.length) throw new Error("No usable rows found.");
            state.planAssignments.clear();
            setStatus(`已讀取 live Sheet：${state.rawRows.length} 位有效人員。`, "live");
            syncAll();
          } catch (error) {
            useFallback(`讀取到回應，但未能解析資料：${error.message}`);
          } finally {
            cleanup();
          }
        };

        const script = document.createElement("script");
        script.src = src;
        script.onerror = () => {
          if (!settled) useFallback("瀏覽器未能讀取 Google Sheet，已載入 sample。可確認分享權限或使用貼上資料。");
          cleanup();
        };
        document.body.appendChild(script);

        const timer = window.setTimeout(() => {
          if (!settled) {
            useFallback("讀取逾時，已載入 sample。Google Sheet 如未公開，請用上方貼上資料。");
            cleanup();
          }
        }, 8000);

        function cleanup() {
          window.clearTimeout(timer);
          window.setTimeout(() => {
            delete window[callback];
            script.remove();
          }, 0);
        }
      }

      function useFallback(message) {
        state.rawRows = normalizeRows(DEFAULT_ROWS);
        state.dataSource = "sample";
        state.planAssignments.clear();
        setStatus(message, "error");
        syncAll();
      }

      function applyFilters() {
        const brand = els.brandFilter.value;
        const center = els.centerFilter.value;
        const asName = els.asFilter.value;
        const search = clean(els.searchInput.value).toLowerCase();
        state.rows = state.rawRows.filter(row => {
          if (brand && row.brand !== brand) return false;
          if (center && row.center !== center) return false;
          if (asName && row.asName !== asName) return false;
          if (!search) return true;
          return [row.brand, row.center, row.asName, row.tlName, row.therapist, row.position, row.highPo, row.salesMtd, row.acbCurrent, row.acbNetChange].some(value => clean(value).toLowerCase().includes(search));
        });
      }

      function unique(list) {
        return [...new Set(list.filter(valid))].sort((a, b) => a.localeCompare(b));
      }

      function realAsNames(rows) {
        const groups = new Map();
        for (const row of rows) {
          if (!valid(row.asName)) continue;
          const key = [row.brand, row.center, row.asName].join("|");
          if (!groups.has(key)) groups.set(key, { name: row.asName, people: new Set(), tls: new Set() });
          groups.get(key).people.add(row.therapist);
          if (valid(row.tlName)) groups.get(key).tls.add(row.tlName);
        }
        return [...groups.values()]
          .filter(group => group.people.size > 1 || group.tls.size > 0)
          .map(group => group.name);
      }

      function fillSelect(select, values, label) {
        const current = select.value;
        select.innerHTML = `<option value="">全部 ${label}</option>` + values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
        if (values.includes(current)) select.value = current;
      }

      function refreshFilters() {
        const selectedBrand = els.brandFilter.value;
        const selectedCenter = els.centerFilter.value;
        const brandRows = selectedBrand ? state.rawRows.filter(row => row.brand === selectedBrand) : state.rawRows;
        const centerRows = selectedCenter ? brandRows.filter(row => row.center === selectedCenter) : brandRows;
        fillSelect(els.brandFilter, unique(state.rawRows.map(row => row.brand)), "Brand");
        fillSelect(els.centerFilter, unique(brandRows.map(row => row.center)), "Center");
        fillSelect(els.asFilter, unique(realAsNames(centerRows)), "AS");
      }

      function buildTree(rows) {
        const asGroups = new Map();
        for (const row of rows) {
          if (!valid(row.asName)) continue;
          const key = [row.brand, row.center, row.asName].join("|");
          if (!asGroups.has(key)) asGroups.set(key, { people: new Set(), tls: new Set() });
          asGroups.get(key).people.add(row.therapist);
          if (valid(row.tlName)) asGroups.get(key).tls.add(row.tlName);
        }
        const isRealAs = row => {
          if (!valid(row.asName)) return false;
          const group = asGroups.get([row.brand, row.center, row.asName].join("|"));
          if (!group) return false;
          return group.people.size > 1 || group.tls.size > 0;
        };
        const personPayload = row => ({
          name: row.therapist,
          position: row.position,
          highPo: row.highPo,
          salesMtd: row.salesMtd,
          acbCurrent: row.acbCurrent,
          acbNetChange: row.acbNetChange
        });
        const copyMetrics = (target, row) => {
          target.position = row.position || target.position || "";
          target.highPo = row.highPo || target.highPo || "";
          target.salesMtd = row.salesMtd || target.salesMtd || "";
          target.acbCurrent = row.acbCurrent || target.acbCurrent || "";
          target.acbNetChange = row.acbNetChange || target.acbNetChange || "";
        };
        const addPerson = (map, row) => {
          if (!map.has(row.therapist)) map.set(row.therapist, personPayload(row));
        };
        const brands = new Map();
        for (const row of rows) {
          if (!brands.has(row.brand)) brands.set(row.brand, { name: row.brand, centers: new Map(), people: new Set() });
          const brand = brands.get(row.brand);
          brand.people.add(row.therapist);
          if (!brand.centers.has(row.center)) brand.centers.set(row.center, { name: row.center, as: new Map(), tls: new Map(), direct: new Map(), people: new Set() });
          const center = brand.centers.get(row.center);
          center.people.add(row.therapist);
          if (!isRealAs(row)) {
            if (valid(row.tlName)) {
              if (!center.tls.has(row.tlName)) center.tls.set(row.tlName, { name: row.tlName, people: new Map(), position: "", highPo: "", salesMtd: "", acbCurrent: "", acbNetChange: "" });
              const tlNode = center.tls.get(row.tlName);
              if (row.therapist === row.tlName) copyMetrics(tlNode, row);
              if (row.therapist !== row.tlName) addPerson(tlNode.people, row);
            } else {
              addPerson(center.direct, row);
            }
            continue;
          }
          const asName = valid(row.asName) ? row.asName : "Unassigned AS";
          if (!center.as.has(asName)) center.as.set(asName, { name: asName, tls: new Map(), direct: new Map(), people: new Set(), position: "", highPo: "", salesMtd: "", acbCurrent: "", acbNetChange: "" });
          const asNode = center.as.get(asName);
          if (row.therapist === asName) copyMetrics(asNode, row);
          if (valid(row.tlName)) {
            if (!asNode.tls.has(row.tlName)) asNode.tls.set(row.tlName, { name: row.tlName, people: new Map(), position: "", highPo: "", salesMtd: "", acbCurrent: "", acbNetChange: "" });
            const tlNode = asNode.tls.get(row.tlName);
            if (row.therapist === row.tlName) copyMetrics(tlNode, row);
            if (row.therapist !== row.tlName) {
              asNode.people.add(row.therapist);
              addPerson(tlNode.people, row);
            }
          } else {
            if (row.therapist !== asName) {
              asNode.people.add(row.therapist);
              addPerson(asNode.direct, row);
            }
          }
        }
        return brands;
      }

      function renderMetrics() {
        const rows = state.rows;
        document.querySelector("#brandCount").textContent = unique(rows.map(row => row.brand)).length;
        document.querySelector("#centerCount").textContent = unique(rows.map(row => row.center)).length;
        document.querySelector("#asCount").textContent = realAsNames(rows).length;
        document.querySelector("#tlCount").textContent = unique(rows.map(row => row.tlName)).length;
        document.querySelector("#therapistCount").textContent = unique(rows.map(row => row.therapist)).length;
      }

      function renderChart() {
        const tree = buildTree(state.rows);
        if (!state.rows.length) {
          els.chartView.innerHTML = `<div class="empty">沒有符合篩選的資料。</div>`;
          return;
        }
        const statPills = item => {
          const stats = [];
          if (valid(item?.salesMtd)) stats.push(`<span class="stat-pill sales">MTD ${escapeHtml(item.salesMtd)}</span>`);
          if (valid(item?.acbCurrent)) {
            const rawChange = clean(item?.acbNetChange);
            const numericChange = Number(rawChange.replaceAll(",", ""));
            const changeText = valid(rawChange) ? ` (${numericChange > 0 ? "+" : ""}${escapeHtml(rawChange)})` : "";
            stats.push(`<span class="stat-pill acb">ACB ${escapeHtml(item.acbCurrent)}${changeText}</span>`);
          }
          return stats.length ? `<div class="org-node-stats">${stats.join("")}</div>` : "";
        };
        const isPotential = item => clean(item?.highPo).toUpperCase() === "Y";
        const node = (type, name, meta, count, extraClass = "", item = null) => `<div class="org-node ${type} ${extraClass} ${isPotential(item) ? "potential" : ""}">
          <small>${escapeHtml(meta)}</small>
          <strong>${escapeHtml(name)}</strong>
          ${statPills(item)}
          ${count ? `<span class="tag org-count">${escapeHtml(count)}</span>` : ""}
        </div>`;
        const leaf = person => node("therapist", person.name, person.position || "Therapist", "", "", person);
        const peopleGrid = people => `<div class="org-leaf-grid">${[...people.values()].map(person => leaf(person)).join("")}</div>`;
        let html = `<div class="org-tree-board">`;
        for (const brand of tree.values()) {
          html += `<section class="org-brand-section">
            <div class="org-section-head">${node("brand", brand.name, "Brand", `${brand.people.size} people`)}</div>
            <div class="org-center-grid">`;
          for (const center of brand.centers.values()) {
            html += `<section class="org-center-section">
              <div class="org-section-head">${node("center", center.name, "Center", `${center.people.size} people`)}</div>
              <div class="org-as-grid">`;
            if (center.direct.size) {
              html += `<section class="org-tl-section org-direct-section">
                <div class="org-section-head">${node("tl direct", "Center Direct", "Direct", `${center.direct.size} people`, "direct")}</div>
                ${peopleGrid(center.direct)}
              </section>`;
            }
            for (const tl of center.tls.values()) {
              const extraClass = tl.people.size > Number(els.tlTarget.value) ? "over" : "";
              html += `<section class="org-tl-section">
                <div class="org-section-head">${node("tl", tl.name, tl.position || "TL", `${tl.people.size} people`, extraClass, tl)}</div>
                ${peopleGrid(tl.people)}
              </section>`;
            }
            for (const asNode of center.as.values()) {
              html += `<section class="org-as-section">
                <div class="org-section-head">${node("as", asNode.name, asNode.position || "AS", `${asNode.people.size} people`, "", asNode)}</div>
                <div class="org-tl-grid">`;
              if (asNode.direct.size) {
                html += `<section class="org-tl-section org-direct-section">
                  <div class="org-section-head">${node("tl direct", "AS Direct", "Direct", `${asNode.direct.size} people`, "direct")}</div>
                  ${peopleGrid(asNode.direct)}
                </section>`;
              }
              for (const tl of asNode.tls.values()) {
                const extraClass = tl.people.size > Number(els.tlTarget.value) ? "over" : "";
                html += `<section class="org-tl-section">
                  <div class="org-section-head">${node("tl", tl.name, tl.position || "TL", `${tl.people.size} people`, extraClass, tl)}</div>
                  ${peopleGrid(tl.people)}
                </section>`;
              }
              html += `</div></section>`;
            }
            html += `</div></section>`;
          }
          html += `</div></section>`;
        }
        html += `</div>`;
        els.chartView.innerHTML = html;
      }

      function getPlanRows() {
        return state.rows.map(row => {
          const key = rowKey(row);
          return { ...row, plannedTl: state.planAssignments.get(key) || row.tlName || "Direct" };
        });
      }

      function renderPlan() {
        const rows = getPlanRows();
        const lanes = new Map();
        rows.forEach(row => {
          const laneKey = `${row.brand}|${row.center}|${row.asName || "Unassigned AS"}|${row.plannedTl}`;
          if (!lanes.has(laneKey)) lanes.set(laneKey, { ...row, people: [] });
          lanes.get(laneKey).people.push(row);
        });
        if (!rows.length) {
          els.planView.innerHTML = `<div class="empty">沒有可規劃的人員。</div>`;
          return;
        }
        let html = `<div class="lane-board">`;
        for (const [laneKey, lane] of lanes) {
          const count = lane.people.length;
          const tagClass = count > Number(els.tlTarget.value) ? "hot" : count < Math.max(2, Number(els.tlTarget.value) - 2) ? "warn" : "";
          html += `<section class="lane" data-lane="${escapeHtml(laneKey)}">
            <div class="lane-head">
              <div><strong>${escapeHtml(lane.plannedTl)}</strong><br><span style="color:var(--muted);font-size:.78rem">${escapeHtml(lane.center)} · ${escapeHtml(lane.asName || "Unassigned AS")}</span></div>
              <span class="tag ${tagClass}">${count}</span>
            </div>
            <div class="lane-body">`;
          for (const person of lane.people) {
            html += `<span class="chip draggable" draggable="true" data-person="${escapeHtml(rowKey(person))}">${escapeHtml(person.therapist)}</span>`;
          }
          html += `</div></section>`;
        }
        html += `</div>`;
        els.planView.innerHTML = html;
        bindDrag();
      }

      function bindDrag() {
        els.planView.querySelectorAll(".draggable").forEach(chip => {
          chip.addEventListener("dragstart", event => {
            event.dataTransfer.setData("text/plain", chip.dataset.person);
          });
        });
        els.planView.querySelectorAll(".lane").forEach(lane => {
          lane.addEventListener("dragover", event => {
            event.preventDefault();
            lane.classList.add("drag-over");
          });
          lane.addEventListener("dragleave", () => lane.classList.remove("drag-over"));
          lane.addEventListener("drop", event => {
            event.preventDefault();
            lane.classList.remove("drag-over");
            const key = event.dataTransfer.getData("text/plain");
            const parts = lane.dataset.lane.split("|");
            state.planAssignments.set(key, parts[3]);
            renderPlan();
            renderInsights();
          });
        });
      }

      function renderTable() {
        const rows = getPlanRows();
        if (!rows.length) {
          els.tableView.innerHTML = `<div class="empty">沒有資料。</div>`;
          return;
        }
        const body = rows.map(row => `<tr>
          <td>${escapeHtml(row.brand)}</td>
          <td>${escapeHtml(row.center)}</td>
          <td>${escapeHtml(row.asName)}</td>
          <td>${escapeHtml(row.tlName || "Direct")}</td>
          <td>${escapeHtml(row.plannedTl)}</td>
          <td>${escapeHtml(row.therapist)}</td>
          <td>${escapeHtml(row.position)}</td>
          <td>${escapeHtml(row.highPo)}</td>
          <td>${escapeHtml(row.salesMtd)}</td>
          <td>${escapeHtml(row.acbCurrent)}</td>
          <td>${escapeHtml(row.acbNetChange)}</td>
        </tr>`).join("");
        els.tableView.innerHTML = `<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:.9rem">
          <thead><tr>
            ${["Brand","Center","AS","Current TL","Planned TL","Therapist","Position","High Po","MTD Sales%","ACB Current","ACB Net Change"].map(item => `<th style="text-align:left;padding:10px;border-bottom:1px solid var(--line);background:#fbfaf7">${item}</th>`).join("")}
          </tr></thead>
          <tbody>${body}</tbody>
        </table></div>`;
      }

      function renderInsights() {
        const rows = getPlanRows();
        const tlTarget = Number(els.tlTarget.value);
        const asTarget = Number(els.asTarget.value);
        const tlGroups = new Map();
        const asGroups = new Map();
        rows.forEach(row => {
          const tlKey = `${row.brand} · ${row.center} · ${row.asName || "Unassigned AS"} · ${row.plannedTl}`;
          const asKey = `${row.brand} · ${row.center} · ${row.asName || "Unassigned AS"}`;
          if (!tlGroups.has(tlKey)) tlGroups.set(tlKey, new Set());
          if (!asGroups.has(asKey)) asGroups.set(asKey, new Set());
          tlGroups.get(tlKey).add(row.therapist);
          asGroups.get(asKey).add(row.therapist);
        });
        const insights = [];
        for (const [key, people] of tlGroups) {
          if (people.size > tlTarget) insights.push({ type: "hot", title: `${key}`, text: `超出 TL 目標 1:${tlTarget}，多出 ${people.size - tlTarget} 人，可以考慮拆 team 或加 trainee TL。` });
          if (people.size <= Math.max(1, tlTarget - 4)) insights.push({ type: "warn", title: `${key}`, text: `低於理想 span，若地點相近可考慮合併或由 AS direct manage。` });
        }
        for (const [key, people] of asGroups) {
          if (people.size > asTarget) insights.push({ type: "hot", title: `${key}`, text: `AS 管理 ${people.size} 人，高過目標 1:${asTarget}，建議提升一位 TL 或拆中心責任。` });
        }
        const directCount = rows.filter(row => !valid(row.tlName) || row.plannedTl === "Direct").length;
        if (directCount) insights.unshift({ type: "warn", title: `${directCount} 位未有 TL / Direct report`, text: "可以用 Drag Plan 將人拖入合適 TL，或保留 AS direct manage。" });
        if (!insights.length) insights.push({ type: "", title: "暫時沒有明顯風險", text: "現時篩選範圍內 team size 接近你設定的目標。" });
        els.insights.innerHTML = insights.slice(0, 12).map(item => `<div class="insight">
          <strong><span class="tag ${item.type}">${item.type === "hot" ? "Over" : item.type === "warn" ? "Check" : "OK"}</span> ${escapeHtml(item.title)}</strong>
          <p>${escapeHtml(item.text)}</p>
        </div>`).join("");
      }

      function syncAll() {
        refreshFilters();
        applyFilters();
        renderMetrics();
        renderChart();
        renderPlan();
        renderTable();
        renderInsights();
        updateView();
      }

      function updateView() {
        const view = state.currentView;
        els.chartView.classList.toggle("hidden", view !== "chart");
        els.planView.classList.toggle("hidden", view !== "plan");
        els.tableView.classList.toggle("hidden", view !== "table");
        els.resetPlanBtn.classList.toggle("hidden", view !== "plan");
        els.mainTitle.textContent = view === "chart" ? "Org Chart" : view === "plan" ? "Drag Plan" : "Planning Table";
        els.mainSubtitle.textContent = view === "chart" ? "按現有 Sheet 層級自動整理。" : view === "plan" ? "拖拉 therapist 去另一個 TL，右邊會即時計規劃提示。" : "匯出時會包含 Planned TL。";
        document.querySelectorAll(".segmented button").forEach(btn => btn.classList.toggle("active", btn.dataset.view === view));
      }

      function parsePasted(text) {
        const lines = clean(text).split(/\r?\n/).filter(Boolean);
        return lines.map(line => {
          const delimiter = line.includes("\t") ? "\t" : ",";
          return line.split(delimiter).map(clean);
        });
      }

      function exportCsv() {
        const header = ["Brand","Center","AS","Current TL","Planned TL","Therapist","Position","High Po","MTD Sales%","ACB Current","ACB Net Change"];
        const rows = getPlanRows().map(row => [row.brand, row.center, row.asName, row.tlName || "Direct", row.plannedTl, row.therapist, row.position, row.highPo, row.salesMtd, row.acbCurrent, row.acbNetChange]);
        const csv = [header, ...rows].map(row => row.map(value => `"${clean(value).replaceAll('"', '""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "org-chart-plan.csv";
        link.click();
        URL.revokeObjectURL(url);
      }

      [els.brandFilter, els.centerFilter, els.asFilter].forEach(select => {
        select.addEventListener("change", () => {
          applyFilters();
          renderMetrics();
          renderChart();
          renderPlan();
          renderTable();
          renderInsights();
        });
      });

      els.searchInput.addEventListener("input", () => {
        applyFilters();
        renderMetrics();
        renderChart();
        renderPlan();
        renderTable();
        renderInsights();
      });

      els.tlTarget.addEventListener("input", () => {
        els.tlTargetValue.textContent = `1:${els.tlTarget.value}`;
        renderChart();
        renderPlan();
        renderInsights();
      });

      els.asTarget.addEventListener("input", () => {
        els.asTargetValue.textContent = `1:${els.asTarget.value}`;
        renderInsights();
      });

      document.querySelectorAll(".segmented button").forEach(button => {
        button.addEventListener("click", () => {
          state.currentView = button.dataset.view;
          updateView();
        });
      });

      els.refreshBtn.addEventListener("click", loadFromGoogleSheet);
      els.printBtn.addEventListener("click", () => window.print());
      els.exportBtn.addEventListener("click", exportCsv);
      els.sideToggle.addEventListener("click", () => {
        const collapsed = els.appLayout.classList.toggle("left-collapsed");
        els.sideToggle.textContent = collapsed ? "≡" : "×";
        els.sideToggle.setAttribute("aria-expanded", String(!collapsed));
      });
      els.insightToggle.addEventListener("click", () => {
        const collapsed = els.insightPanel.classList.toggle("collapsed");
        els.contentGrid.classList.toggle("insights-collapsed", collapsed);
        els.insightToggle.textContent = collapsed ? "+" : "−";
        els.insightToggle.setAttribute("aria-expanded", String(!collapsed));
      });
      els.resetPlanBtn.addEventListener("click", () => {
        state.planAssignments.clear();
        renderPlan();
        renderTable();
        renderInsights();
      });
      els.pasteBtn.addEventListener("click", () => {
        const parsed = parsePasted(els.pasteBox.value);
        const rows = normalizeRows(parsed);
        if (!rows.length) {
          setStatus("貼上資料未能辨認。請按 Brand, Center, AS, TL, Therapist 次序貼上。", "error");
          return;
        }
        state.rawRows = rows;
        state.dataSource = "pasted";
        state.planAssignments.clear();
        setStatus(`已套用貼上資料：${rows.length} 位有效人員。`, "live");
        syncAll();
      });

      loadFromGoogleSheet();
    </script>
  </body>
</html>
