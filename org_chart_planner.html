<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Org Chart Planner</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172126;
        --muted: #627078;
        --bg: #f5f3ef;
        --surface: #ffffff;
        --surface-2: #e9f0ee;
        --line: #d7ddd9;
        --line-strong: #b9c5bf;
        --connector: #6e8580;
        --teal: #0f766e;
        --teal-soft: #d9f0ec;
        --tiffany: #0ab8b6;
        --tiffany-soft: #d7fbfa;
        --coral: #d9654f;
        --coral-soft: #ffe5df;
        --amber: #b98219;
        --amber-soft: #fff1cf;
        --blue: #365f91;
        --blue-soft: #e0ebf7;
        --shadow: 0 18px 50px rgba(35, 44, 41, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 14px clamp(14px, 3vw, 30px);
        border-bottom: 1px solid var(--line);
        background: rgba(245, 243, 239, 0.9);
        backdrop-filter: blur(14px);
      }

      .title-block {
        min-width: 0;
      }

      .title-block h1 {
        margin: 0;
        font-size: clamp(1.25rem, 2.3vw, 2rem);
        line-height: 1.08;
      }

      .title-block p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .legend-ribbon {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        padding: 8px 12px;
        border: 1px solid rgba(10, 184, 182, 0.42);
        border-radius: 8px;
        background: var(--tiffany-soft);
        color: #07564f;
        font-size: 0.86rem;
        font-weight: 850;
      }

      .legend-swatch {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        border: 2px solid var(--tiffany);
        border-radius: 5px;
        background: var(--tiffany-soft);
      }

      .btn,
      .icon-btn,
      .segmented button {
        min-height: 38px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        font-weight: 750;
      }

      .btn.primary {
        border-color: #0f766e;
        background: var(--teal);
        color: white;
      }

      .icon-btn {
        width: 38px;
        display: inline-grid;
        place-items: center;
        font-size: 1.05rem;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        min-height: 0;
        transition: grid-template-columns 180ms ease;
      }

      .layout.left-collapsed {
        grid-template-columns: 56px minmax(0, 1fr);
      }

      aside {
        position: sticky;
        top: 67px;
        align-self: start;
        height: calc(100vh - 67px);
        overflow: auto;
        padding: 16px;
        border-right: 1px solid var(--line);
        background: #fbfaf7;
      }

      .side-rail {
        display: none;
      }

      .side-toggle {x
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-weight: 900;
      }

      .layout.left-collapsed aside {
        overflow: hidden;
        padding: 8px;
      }

      .layout.left-collapsed .side-section {
        display: none;
      }

      .layout.left-collapsed .side-rail {
        display: grid;
        justify-items: center;
        gap: 12px;
      }

      .layout.left-collapsed .side-rail-label {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      .layout:not(.left-collapsed) .side-rail {
        display: block;
        margin-bottom: 12px;
      }

      .layout:not(.left-collapsed) .side-rail-label {
        display: none;
      }

      main {
        min-width: 0;
        padding: 18px clamp(14px, 3vw, 30px) 36px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .side-section {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .side-section + .side-section {
        margin-top: 12px;
      }

      .side-section h2,
      .panel-title h2 {
        margin: 0;
        font-size: 0.98rem;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }

      label {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      select,
      input,
      textarea {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        padding: 8px 10px;
      }

      textarea {
        min-height: 122px;
        resize: vertical;
      }

      .range-row {
        display: grid;
        grid-template-columns: 1fr 42px;
        gap: 10px;
        align-items: center;
      }

      input[type="range"] {
        padding: 0;
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 12px;
      }

      .segmented button {
        padding: 0 8px;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .segmented button.active {
        border-color: var(--blue);
        background: var(--blue-soft);
        color: #173a66;
      }

      .status {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 10px;
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.35;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        margin-top: 4px;
        border-radius: 999px;
        background: var(--amber);
      }

      .status.live .status-dot {
        background: var(--teal);
      }

      .status.error .status-dot {
        background: var(--coral);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .metric {
        min-height: 88px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 850;
        text-transform: uppercase;
      }

      .metric strong {
        display: block;
        margin-top: 8px;
        font-size: clamp(1.55rem, 3vw, 2.35rem);
        line-height: 0.95;
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 14px;
        align-items: start;
        transition: grid-template-columns 180ms ease;
      }

      .content-grid.insights-collapsed {
        grid-template-columns: minmax(0, 1fr) 56px;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .chart-wrap {
        overflow: auto;
        min-height: 520px;
        padding: 16px;
      }

      .org-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 12px;
        align-items: start;
      }

      .brand-band {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
      }

      .brand-band h3 {
        margin: 0 0 10px;
        font-size: 1rem;
      }

      .center-card {
        margin-top: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .center-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-2);
        font-weight: 850;
      }

      .as-list {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .person-card {
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
      }

      .person-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px;
        background: linear-gradient(90deg, #f7fbfa, #eef6f5);
      }

      .name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-weight: 900;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 8px;
        border-radius: 999px;
        background: var(--teal-soft);
        color: #07564f;
        font-size: 0.72rem;
        font-weight: 900;
        white-space: nowrap;
      }

      .tag.as {
        background: var(--blue-soft);
        color: #173a66;
      }

      .tag.warn {
        background: var(--amber-soft);
        color: #714909;
      }

      .tag.hot {
        background: var(--coral-soft);
        color: #9f2f1e;
      }

      .children {
        display: grid;
        gap: 8px;
        padding: 10px;
      }

      .tl-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
      }

      .tl-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 10px;
        border-bottom: 1px dashed var(--line-strong);
      }

      .therapist-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 9px;
      }

      .org-tree-board {
        display: grid;
        gap: 18px;
        min-width: min(1180px, max-content);
        padding: 4px 4px 28px;
      }

      .org-brand-section,
      .org-center-section,
      .org-as-section,
      .org-tl-section {
        display: grid;
        gap: 12px;
      }

      .org-brand-section {
        justify-items: center;
        min-width: 1080px;
      }

      .org-center-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 14px;
        width: 100%;
      }

      .org-center-section,
      .org-as-section,
      .org-tl-section {
        position: relative;
        align-content: start;
        border: 1px solid rgba(110, 133, 128, 0.24);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.68);
      }

      .org-center-section {
        padding: 14px;
      }

      .org-as-grid,
      .org-tl-grid,
      .org-leaf-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }

      .org-as-section {
        padding: 12px;
        background: rgba(224, 235, 247, 0.34);
      }

      .org-tl-section {
        padding: 10px;
        background: rgba(255, 241, 207, 0.36);
      }

      .org-direct-section {
        background: rgba(255, 241, 207, 0.42);
        border-style: dashed;
      }

      .org-section-head {
        display: flex;
        justify-content: center;
      }

      .org-node {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 5px;
        width: 154px;
        min-height: 76px;
        padding: 10px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 12px 26px rgba(35, 44, 41, 0.08);
        text-align: center;
      }

      .org-node strong {
        overflow-wrap: anywhere;
        font-size: 0.88rem;
        line-height: 1.18;
      }

      .org-node small {
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 850;
        text-transform: uppercase;
      }

      .org-node.brand {
        width: 190px;
        min-height: 84px;
        border-color: #0f766e;
        background: linear-gradient(180deg, #e5f6f3, #fff);
      }

      .org-node.center {
        width: 188px;
        border-color: #97b7b1;
        background: #f7fbfa;
      }

      .org-node.as {
        border-color: #8aa8ca;
        background: var(--blue-soft);
      }

      .org-node.tl {
        border-color: #d3b16e;
        background: var(--amber-soft);
      }

      .org-node.tl.over {
        border-color: #d9654f;
        background: var(--coral-soft);
      }

      .org-node.potential {
        border-color: var(--tiffany);
        background: var(--tiffany-soft);
        box-shadow: 0 14px 30px rgba(10, 184, 182, 0.16);
      }

      .org-node.as.potential,
      .org-node.tl.potential,
      .org-node.tl.over.potential,
      .org-node.therapist.potential {
        border-color: var(--tiffany);
        background: var(--tiffany-soft);
      }

      .org-node.terminated,
      .org-node.as.terminated,
      .org-node.tl.terminated,
      .org-node.tl.over.terminated,
      .org-node.therapist.terminated,
      .org-node.potential.terminated {
        border-color: #d64532;
        background: #ffe2dd;
        box-shadow: 0 14px 30px rgba(182, 58, 42, 0.18);
      }

      .org-node.direct {
        border-style: dashed;
      }

      .org-node.therapist {
        width: 100%;
        min-width: 132px;
        min-height: 54px;
        padding: 8px;
        background: #fff;
      }

      .org-node.therapist strong {
        font-size: 0.78rem;
      }

      .org-count {
        justify-self: center;
      }

      .org-node-stats {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: wrap;
      }

      .stat-pill {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 0 7px;
        border-radius: 999px;
        background: #f3f7f5;
        color: #354b45;
        font-size: 0.68rem;
        font-weight: 900;
        white-space: nowrap;
      }

      .stat-pill.sales {
        background: #e8f2ff;
        color: #234d78;
      }

      .stat-pill.sales.good {
        background: #daf2e4;
        color: #16633a;
      }

      .stat-pill.sales.watch {
        background: #fff1c7;
        color: #755107;
      }

      .stat-pill.sales.low {
        background: #ffe0dc;
        color: #9a2c1f;
      }

      .stat-pill.acb {
        background: #f8ecd2;
        color: #76500b;
      }

      .stat-pill.terminated {
        background: #f9b8af;
        color: #812b21;
      }

      .stat-pill.hire {
        background: #d7fbfa;
        color: #07564f;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        max-width: 100%;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        font-size: 0.82rem;
        font-weight: 750;
        overflow-wrap: anywhere;
      }

      .chip.terminated {
        border-color: #d64532;
        background: #ffe2dd;
        color: #812b21;
      }

      .lane-board {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 10px;
      }

      .lane {
        min-height: 230px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
      }

      .lane.drag-over {
        outline: 3px solid rgba(15, 118, 110, 0.25);
      }

      .lane-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 10px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .lane-body {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 7px;
        min-height: 176px;
        padding: 10px;
      }

      .draggable {
        cursor: grab;
        user-select: none;
      }

      .draggable:active {
        cursor: grabbing;
      }

      .insight-list {
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .insight-panel.collapsed .insight-list {
        display: none;
      }

      .insight-panel {
        overflow: hidden;
      }

      .insight-panel.collapsed {
        position: sticky;
        top: 84px;
        min-height: 240px;
        box-shadow: none;
      }

      .insight-panel.collapsed .panel-head {
        display: grid;
        justify-items: center;
        gap: 10px;
        min-height: 240px;
        padding: 8px;
        border-bottom: 0;
      }

      .insight-panel.collapsed .panel-title {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        display: grid;
        justify-items: center;
        gap: 8px;
      }

      .insight-panel.collapsed .panel-title p {
        display: none;
      }

      .collapse-btn {
        min-width: 38px;
        min-height: 38px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-weight: 900;
      }

      .insight {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .insight strong {
        display: block;
        margin-bottom: 4px;
        overflow-wrap: anywhere;
      }

      .insight p {
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.4;
      }

      .empty {
        display: grid;
        place-items: center;
        min-height: 260px;
        color: var(--muted);
        text-align: center;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 1050px) {
        .layout,
        .content-grid {
          grid-template-columns: 1fr;
        }

        aside {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .metric-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .topbar {
          grid-template-columns: 1fr;
        }

        .toolbar {
          justify-content: stretch;
        }

        .toolbar .btn {
          flex: 1 1 auto;
          justify-content: center;
        }

        .metric-grid {
          grid-template-columns: 1fr;
        }

        .segmented {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="title-block">
          <h1>Neoderm Leadership Planner</h1>
          <p>Orgchart</p>
        </div>
        <div class="toolbar">
          <button class="btn primary" id="refreshBtn" type="button">↻ 重新讀 Apps Script</button>
          <button class="btn" id="printBtn" type="button">⎙ 列印</button>
          <button class="btn" id="exportBtn" type="button">⇩ 匯出 CSV</button>
        </div>
        <div class="legend-ribbon" aria-label="Org chart color legend">
          <span class="legend-swatch"></span>
          <span>Tiffany blue = High Potential Network Team Leader</span>
        </div>
      </header>

      <div class="layout" id="appLayout">
        <aside>
          <div class="side-rail">
            <button class="side-toggle" id="sideToggle" type="button" title="收合 / 展開左側控制">×</button>
            <div class="side-rail-label">Controls</div>
          </div>
          <section class="side-section">
            <h2>資料來源</h2>
            <div class="field">
              <label for="appsScriptUrl">Apps Script Web App URL</label>
              <input id="appsScriptUrl" value="https://script.google.com/macros/s/AKfycbxQ2MV6YSf2kYiYvrc4B6yxTrT6AihKh47ddlfhDwX_XBWtaWKvbGWOemUuG78W2v-j/exec" placeholder="Optional: paste /exec URL here">
            </div>
            <div class="field">
              <div class="status" id="statusBox">
                <span class="status-dot"></span>
                <span id="statusText">準備讀取 30+2 Summary Master 的 B/C/D/E/G/I/L/P/T/Y/Z/AY/AZ 欄。</span>
              </div>
            </div>
          </section>

          <section class="side-section">
            <h2>篩選</h2>
            <div class="field">
              <label for="brandFilter">Brand</label>
              <select id="brandFilter"></select>
            </div>
            <div class="field">
              <label for="centerFilter">Center</label>
              <select id="centerFilter"></select>
            </div>
            <div class="field">
              <label for="asFilter">AS</label>
              <select id="asFilter"></select>
            </div>
            <div class="field">
              <label for="searchInput">搜尋人名 / Center</label>
              <input id="searchInput" placeholder="例如 katy.laiky">
            </div>
          </section>

    <script>
      const DEFAULT_ROWS = [

      const state = {
        rawRows: [],

      const els = {
        appsScriptUrl: document.querySelector("#appsScriptUrl"),

        refreshBtn: document.querySelector("#refreshBtn"),
        printBtn: document.querySelector("#printBtn"),

        tlTarget: document.querySelector("#tlTarget"),

        asTarget: document.querySelector("#asTarget"),
        asTargetValue: document.querySelector("#asTargetValue"),
        chartView: document.querySelector("#chartView"),
        planView: document.querySelector("#planView"),
        tableView: document.querySelector("#tableView"),
        insights: document.querySelector("#insights"),
        insightPanel: document.querySelector("#insightPanel"),
        insightToggle: document.querySelector("#insightToggle"),
        contentGrid: document.querySelector("#contentGrid"),
        appLayout: document.querySelector("#appLayout"),
        sideToggle: document.querySelector("#sideToggle"),
        mainTitle: document.querySelector("#mainTitle"),
        mainSubtitle: document.querySelector("#mainSubtitle"),
        resetPlanBtn: document.querySelector("#resetPlanBtn"),
        pasteBox: document.querySelector("#pasteBox"),
        pasteBtn: document.querySelector("#pasteBtn")
      };

      function clean(value) {
        return String(value ?? "").trim();
      }

      function valid(value) {
        const text = clean(value);
        return text && text !== "#N/A" && text.toLowerCase() !== "null";
      }

      function rowKey(row) {
        return [row.brand, row.center, row.asName, row.tlName, row.therapist, row.terminationDate, row.position, row.highPo, row.salesMtd, row.acbCurrent, row.acbNetChange, row.hiresOnboarded, row.hiresPending].join("|");
      }

      function escapeHtml(value) {
        return clean(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function setStatus(text, type = "") {
        els.statusBox.className = `status ${type}`.trim();
        els.statusText.textContent = text;
      }

      function hasHireValues(rows) {
        return rows.some(row => valid(row.hiresOnboarded) || valid(row.hiresPending));
      }

      function normalizeRows(values) {
        const output = [];
        const seen = new Set();
        for (const source of values) {
          const row = {
            brand: clean(source[0]).toLowerCase(),
            center: clean(source[1]),
            asName: clean(source[2]),
            tlName: clean(source[3]),
            therapist: clean(source[4]),
            terminationDate: clean(source[5]),
            position: clean(source[6]),
            highPo: clean(source[7]),
            salesMtd: clean(source[8]),
            acbCurrent: clean(source[9]),
            acbNetChange: clean(source[10]),
            hiresOnboarded: clean(source[11]),
            hiresPending: clean(source[12])
          };
          if (!valid(row.brand) || !valid(row.center) || !valid(row.therapist)) continue;
          if (row.brand === "brand" || row.therapist.toLowerCase() === "therapist") continue;
          if (!valid(row.asName) && !valid(row.tlName)) row.asName = "Unassigned AS";
          const key = rowKey(row);
          if (seen.has(key)) continue;
          seen.add(key);
          output.push(row);
        }
        return output;
      }

      function extractSheetId(url) {
        const match = clean(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
        return match ? match[1] : clean(url);
      }

      function readCell(cell) {
        if (!cell) return "";
        return cell.f ?? cell.v ?? "";
      }

      function pickSourceColumns(row) {
        return [
          row[0],
          row[1],
          row[2],
          row[3],
          row[5],
          row[7],
          row[10],
          row[14],
          row[18],
          row[23],
          row[24],
          row[49],
          row[50]
        ];
      }

      function normalizeHeader(value) {
        return clean(value).toLowerCase().replace(/\s+/g, " ");
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let cell = "";
        let quoted = false;
        for (let index = 0; index < text.length; index += 1) {
          const char = text[index];
          const next = text[index + 1];
          if (quoted) {
            if (char === '"' && next === '"') {
              cell += '"';
              index += 1;
            } else if (char === '"') {
              quoted = false;
            } else {
              cell += char;
            }
          } else if (char === '"') {
            quoted = true;
          } else if (char === ",") {
            row.push(clean(cell));
            cell = "";
          } else if (char === "\n") {
            row.push(clean(cell));
            rows.push(row);
            row = [];
            cell = "";
          } else if (char !== "\r") {
            cell += char;
          }
        }
        if (cell || row.length) {
          row.push(clean(cell));
          rows.push(row);
        }
        return rows;
      }

      function pickRowsByHeader(rows) {
        const headerIndex = rows.findIndex(row => {
          const headers = row.map(normalizeHeader);
          return headers.includes("brand") && headers.includes("center") && headers.includes("therapist");
        });
        if (headerIndex < 0) return [];

        const headers = rows[headerIndex].map(normalizeHeader);
        const findColumn = names => {
          const targets = names.map(normalizeHeader);
          return headers.findIndex(header => targets.includes(header));
        };
        const columns = {
          brand: findColumn(["Brand"]),
          center: findColumn(["Center"]),
          asName: findColumn(["AS NAME"]),
          tlName: findColumn(["TL NAME"]),
          therapist: findColumn(["Therapist"]),
          terminationDate: findColumn(["Termination Date"]),
          position: findColumn(["Therapist Postion", "Therapist Position"]),
          highPo: findColumn(["High Po"]),
          salesMtd: findColumn(["MTD Sales%"]),
          acbCurrent: findColumn(["ACB Current"]),
          acbNetChange: findColumn(["ACB Net Change"]),
          hiresOnboarded: findColumn(["Hires Onboarded", "Onboarded Hires", "Onboarded", "已 Onboard", "已經 onboard", "已經 onboard 咗"]),
          hiresPending: findColumn(["Hires Pending Onboard", "Pending Onboard", "Pending Onboarded", "尚未 Onboard", "尚未 onboard", "尚未 onboard 咗"])
        };

        if ([columns.brand, columns.center, columns.therapist].some(index => index < 0)) return [];

        return rows.slice(headerIndex + 1).map(row => [
          row[columns.brand],
          row[columns.center],
          columns.asName >= 0 ? row[columns.asName] : "",
          columns.tlName >= 0 ? row[columns.tlName] : "",
          row[columns.therapist],
          columns.terminationDate >= 0 ? row[columns.terminationDate] : "",
          columns.position >= 0 ? row[columns.position] : "",
          columns.highPo >= 0 ? row[columns.highPo] : "",
          columns.salesMtd >= 0 ? row[columns.salesMtd] : "",
          columns.acbCurrent >= 0 ? row[columns.acbCurrent] : "",
          columns.acbNetChange >= 0 ? row[columns.acbNetChange] : "",
          columns.hiresOnboarded >= 0 ? row[columns.hiresOnboarded] : row[49],
          columns.hiresPending >= 0 ? row[columns.hiresPending] : row[50]
        ]);
      }

      function jsonp(src, timeoutMs = 12000) {
        return new Promise((resolve, reject) => {
          const callback = `__orgChart_${Date.now()}_${Math.random().toString(36).slice(2)}`;
          const script = document.createElement("script");
          const separator = src.includes("?") ? "&" : "?";
          let settled = false;

          function cleanup() {
            window.clearTimeout(timer);
            window.setTimeout(() => {
              delete window[callback];
              script.remove();
            }, 0);
          }

          window[callback] = payload => {
            settled = true;
            resolve(payload);
            cleanup();
          };

          script.onerror = () => {
            if (!settled) reject(new Error("JSONP request was blocked."));
            cleanup();
          };

          const timer = window.setTimeout(() => {
            if (!settled) {
              reject(new Error("JSONP request timed out."));
              cleanup();
            }
          }, timeoutMs);

          script.src = `${src}${separator}callback=${encodeURIComponent(callback)}&cachebust=${Date.now()}`;
          document.body.appendChild(script);
        });
      }

      async function loadAppsScriptRows(url) {
        const payload = await jsonp(url);
        if (payload?.error) throw new Error(payload.error);
        const values = Array.isArray(payload?.values) ? payload.values : Array.isArray(payload) ? payload : [];
        const rows = normalizeRows(pickRowsByHeader(values));
        if (!rows.length) throw new Error("Apps Script response did not contain usable rows.");
        return {
          rows,
          source: clean(payload?.source),
          columnCount: values.reduce((max, row) => Math.max(max, Array.isArray(row) ? row.length : 0), 0)
        };
      }

      async function loadFromAppsScript() {
        const appsScriptUrl = clean(els.appsScriptUrl.value);
        if (!appsScriptUrl) {
          state.rawRows = [];
          state.dataSource = "apps-script";
          state.planAssignments.clear();
          setStatus("請先填入 Apps Script Web App URL。此工具只使用 Apps Script。", "error");
          syncAll();
          return;
        }

        setStatus("正在透過 Apps Script 讀取資料...", "");

        try {
          const result = await loadAppsScriptRows(appsScriptUrl);
          const rows = result.rows;
          const sourceText = result.source || "unknown range";
          const widthText = `${result.columnCount} columns`;
          const includesAyAzRange = /AZ/i.test(sourceText) || result.columnCount >= 51;
          state.rawRows = rows;
          state.dataSource = "apps-script";
          state.planAssignments.clear();
          setStatus(hasHireValues(state.rawRows) ? `已透過 Apps Script 讀取：${state.rawRows.length} 位有效人員，包含 AY/AZ。` : includesAyAzRange ? `Apps Script 已回傳 ${sourceText}（${widthText}），但 AY/AZ 目前未見數值。` : `Apps Script 仍未回傳 AY/AZ：${sourceText}（${widthText}）。請 Deploy new version 到 B1:AZ260。`, hasHireValues(state.rawRows) ? "live" : "error");
          syncAll();
        } catch (error) {
          state.rawRows = [];
          state.dataSource = "apps-script";
          state.planAssignments.clear();
          setStatus(`Apps Script 未能讀取：${error.message}`, "error");
          syncAll();
        }
      }

      function applyFilters() {
        const brand = els.brandFilter.value;
        const center = els.centerFilter.value;
        const asName = els.asFilter.value;
        const search = clean(els.searchInput.value).toLowerCase();
        state.rows = state.rawRows.filter(row => {
          if (brand && row.brand !== brand) return false;
          if (center && row.center !== center) return false;
          if (asName && row.asName !== asName) return false;
          if (!search) return true;
          return [row.brand, row.center, row.asName, row.tlName, row.therapist, row.terminationDate, row.position, row.highPo, row.salesMtd, row.acbCurrent, row.acbNetChange, row.hiresOnboarded, row.hiresPending].some(value => clean(value).toLowerCase().includes(search));
        });
      }

      function unique(list) {
        return [...new Set(list.filter(valid))].sort((a, b) => a.localeCompare(b));
      }

      function realAsNames(rows) {
        const groups = new Map();
        for (const row of rows) {
          if (!valid(row.asName)) continue;
          const key = [row.brand, row.center, row.asName].join("|");
          if (!groups.has(key)) groups.set(key, { name: row.asName, people: new Set(), tls: new Set() });
          groups.get(key).people.add(row.therapist);
          if (valid(row.tlName)) groups.get(key).tls.add(row.tlName);
        }
        return [...groups.values()]
          .filter(group => group.people.size > 1 || group.tls.size > 0)
          .map(group => group.name);
      }

      function fillSelect(select, values, label) {
        const current = select.value;
        select.innerHTML = `<option value="">全部 ${label}</option>` + values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
        if (values.includes(current)) select.value = current;
      }

      function refreshFilters() {
        const selectedBrand = els.brandFilter.value;
        const selectedCenter = els.centerFilter.value;
        const brandRows = selectedBrand ? state.rawRows.filter(row => row.brand === selectedBrand) : state.rawRows;
        const centerRows = selectedCenter ? brandRows.filter(row => row.center === selectedCenter) : brandRows;
        fillSelect(els.brandFilter, unique(state.rawRows.map(row => row.brand)), "Brand");
        fillSelect(els.centerFilter, unique(brandRows.map(row => row.center)), "Center");
        fillSelect(els.asFilter, unique(realAsNames(centerRows)), "AS");
      }

      function buildTree(rows) {
        const asGroups = new Map();
        for (const row of rows) {
          if (!valid(row.asName)) continue;
          const key = [row.brand, row.center, row.asName].join("|");
          if (!asGroups.has(key)) asGroups.set(key, { people: new Set(), tls: new Set() });
          asGroups.get(key).people.add(row.therapist);
          if (valid(row.tlName)) asGroups.get(key).tls.add(row.tlName);
        }
        const isRealAs = row => {
          if (!valid(row.asName)) return false;
          const group = asGroups.get([row.brand, row.center, row.asName].join("|"));
          if (!group) return false;
          return group.people.size > 1 || group.tls.size > 0;
        };
        const personPayload = row => ({
          name: row.therapist,
          terminationDate: row.terminationDate,
          position: row.position,
          highPo: row.highPo,
          salesMtd: row.salesMtd,
          acbCurrent: row.acbCurrent,
          acbNetChange: row.acbNetChange,
          hiresOnboarded: row.hiresOnboarded,
          hiresPending: row.hiresPending
        });
        const copyMetrics = (target, row) => {
          target.terminationDate = row.terminationDate || target.terminationDate || "";
          target.position = row.position || target.position || "";
          target.highPo = row.highPo || target.highPo || "";
          target.salesMtd = row.salesMtd || target.salesMtd || "";
          target.acbCurrent = row.acbCurrent || target.acbCurrent || "";
          target.acbNetChange = row.acbNetChange || target.acbNetChange || "";
          target.hiresOnboarded = row.hiresOnboarded || target.hiresOnboarded || "";
          target.hiresPending = row.hiresPending || target.hiresPending || "";
        };
        const addPerson = (map, row) => {
          if (!map.has(row.therapist)) map.set(row.therapist, personPayload(row));
        };
        const brands = new Map();
        for (const row of rows) {
          if (!brands.has(row.brand)) brands.set(row.brand, { name: row.brand, centers: new Map(), people: new Set() });
          const brand = brands.get(row.brand);
          brand.people.add(row.therapist);
          if (!brand.centers.has(row.center)) brand.centers.set(row.center, { name: row.center, as: new Map(), tls: new Map(), direct: new Map(), people: new Set() });
          const center = brand.centers.get(row.center);
          center.people.add(row.therapist);
          if (!isRealAs(row)) {
            if (valid(row.tlName)) {
              if (!center.tls.has(row.tlName)) center.tls.set(row.tlName, { name: row.tlName, people: new Map(), terminationDate: "", position: "", highPo: "", salesMtd: "", acbCurrent: "", acbNetChange: "", hiresOnboarded: "", hiresPending: "" });
              const tlNode = center.tls.get(row.tlName);
              if (row.therapist === row.tlName) copyMetrics(tlNode, row);
              if (row.therapist !== row.tlName) addPerson(tlNode.people, row);
            } else {
              addPerson(center.direct, row);
            }
            continue;
          }
          const asName = valid(row.asName) ? row.asName : "Unassigned AS";
          if (!center.as.has(asName)) center.as.set(asName, { name: asName, tls: new Map(), direct: new Map(), people: new Set(), terminationDate: "", position: "", highPo: "", salesMtd: "", acbCurrent: "", acbNetChange: "", hiresOnboarded: "", hiresPending: "" });
          const asNode = center.as.get(asName);
          if (row.therapist === asName) copyMetrics(asNode, row);
          if (valid(row.tlName)) {
            if (!asNode.tls.has(row.tlName)) asNode.tls.set(row.tlName, { name: row.tlName, people: new Map(), terminationDate: "", position: "", highPo: "", salesMtd: "", acbCurrent: "", acbNetChange: "", hiresOnboarded: "", hiresPending: "" });
            const tlNode = asNode.tls.get(row.tlName);
            if (row.therapist === row.tlName) copyMetrics(tlNode, row);
            if (row.therapist !== row.tlName) {
              asNode.people.add(row.therapist);
              addPerson(tlNode.people, row);
            }
          } else {
            if (row.therapist !== asName) {
              asNode.people.add(row.therapist);
              addPerson(asNode.direct, row);
            }
          }
        }
        return brands;
      }

      function renderMetrics() {
        const rows = state.rows;
        document.querySelector("#brandCount").textContent = unique(rows.map(row => row.brand)).length;
        document.querySelector("#centerCount").textContent = unique(rows.map(row => row.center)).length;
        document.querySelector("#asCount").textContent = realAsNames(rows).length;
        document.querySelector("#tlCount").textContent = unique(rows.map(row => row.tlName)).length;
        document.querySelector("#therapistCount").textContent = unique(rows.map(row => row.therapist)).length;
      }

      function renderChart() {
        const tree = buildTree(state.rows);
        if (!state.rows.length) {
          els.chartView.innerHTML = `<div class="empty">沒有符合篩選的資料。</div>`;
          return;
        }
        const statPills = item => {
          const stats = [];
          const salesClass = value => {
            const number = Number(clean(value).replace("%", "").replaceAll(",", ""));
            if (!Number.isFinite(number)) return "";
            if (number >= 100) return "good";
            if (number >= 90) return "watch";
            return "low";
          };
          if (valid(item?.salesMtd)) stats.push(`<span class="stat-pill sales ${salesClass(item.salesMtd)}">MTD ${escapeHtml(item.salesMtd)}</span>`);
          if (valid(item?.acbCurrent)) {
            const rawChange = clean(item?.acbNetChange);
            const numericChange = Number(rawChange.replaceAll(",", ""));
            const changeText = valid(rawChange) ? ` (${numericChange > 0 ? "+" : ""}${escapeHtml(rawChange)})` : "";
            stats.push(`<span class="stat-pill acb">ACB ${escapeHtml(item.acbCurrent)}${changeText}</span>`);
          }
          if (valid(item?.terminationDate)) stats.push(`<span class="stat-pill terminated">Last day ${escapeHtml(item.terminationDate)}</span>`);
          if (valid(item?.hiresOnboarded)) stats.push(`<span class="stat-pill hire">ONB ${escapeHtml(item.hiresOnboarded)}</span>`);
          if (valid(item?.hiresPending)) stats.push(`<span class="stat-pill hire">PEND ${escapeHtml(item.hiresPending)}</span>`);
          return stats.length ? `<div class="org-node-stats">${stats.join("")}</div>` : "";
        };
        const isPotential = item => clean(item?.highPo).toUpperCase() === "Y";
        const isTerminated = item => valid(item?.terminationDate);
        const node = (type, name, meta, count, extraClass = "", item = null) => `<div class="org-node ${type} ${extraClass} ${isPotential(item) ? "potential" : ""} ${isTerminated(item) ? "terminated" : ""}">
          <small>${escapeHtml(meta)}</small>
          <strong>${escapeHtml(name)}</strong>
          ${statPills(item)}
          ${count ? `<span class="tag org-count">${escapeHtml(count)}</span>` : ""}
        </div>`;
        const leaf = person => node("therapist", person.name, person.position || "Therapist", "", "", person);
        const peopleGrid = people => `<div class="org-leaf-grid">${[...people.values()].map(person => leaf(person)).join("")}</div>`;
        let html = `<div class="org-tree-board">`;
        for (const brand of tree.values()) {
          html += `<section class="org-brand-section">
            <div class="org-section-head">${node("brand", brand.name, "Brand", `${brand.people.size} people`)}</div>
            <div class="org-center-grid">`;
          for (const center of brand.centers.values()) {
            html += `<section class="org-center-section">
              <div class="org-section-head">${node("center", center.name, "Center", `${center.people.size} people`)}</div>
              <div class="org-as-grid">`;
            if (center.direct.size) {
              html += `<section class="org-tl-section org-direct-section">
                <div class="org-section-head">${node("tl direct", "Center Direct", "Direct", `${center.direct.size} people`, "direct")}</div>
                ${peopleGrid(center.direct)}
              </section>`;
            }
            for (const tl of center.tls.values()) {
              const extraClass = tl.people.size > Number(els.tlTarget.value) ? "over" : "";
              html += `<section class="org-tl-section">
                <div class="org-section-head">${node("tl", tl.name, tl.position || "TL", `${tl.people.size} people`, extraClass, tl)}</div>
                ${peopleGrid(tl.people)}
              </section>`;
            }
            for (const asNode of center.as.values()) {
              html += `<section class="org-as-section">
                <div class="org-section-head">${node("as", asNode.name, asNode.position || "AS", `${asNode.people.size} people`, "", asNode)}</div>
                <div class="org-tl-grid">`;
              if (asNode.direct.size) {
                html += `<section class="org-tl-section org-direct-section">
                  <div class="org-section-head">${node("tl direct", "AS Direct", "Direct", `${asNode.direct.size} people`, "direct")}</div>
                  ${peopleGrid(asNode.direct)}
                </section>`;
              }
              for (const tl of asNode.tls.values()) {
                const extraClass = tl.people.size > Number(els.tlTarget.value) ? "over" : "";
                html += `<section class="org-tl-section">
                  <div class="org-section-head">${node("tl", tl.name, tl.position || "TL", `${tl.people.size} people`, extraClass, tl)}</div>
                  ${peopleGrid(tl.people)}
                </section>`;
              }
              html += `</div></section>`;
            }
            html += `</div></section>`;
          }
          html += `</div></section>`;
        }
        html += `</div>`;
        els.chartView.innerHTML = html;
      }

      function getPlanRows() {
        return state.rows.map(row => {
          const key = rowKey(row);
          return { ...row, plannedTl: state.planAssignments.get(key) || row.tlName || "Direct" };
        });
      }

      function renderPlan() {
        const rows = getPlanRows();
        const lanes = new Map();
        rows.forEach(row => {
          const laneKey = `${row.brand}|${row.center}|${row.asName || "Unassigned AS"}|${row.plannedTl}`;
          if (!lanes.has(laneKey)) lanes.set(laneKey, { ...row, people: [] });
          lanes.get(laneKey).people.push(row);
        });
        if (!rows.length) {
          els.planView.innerHTML = `<div class="empty">沒有可規劃的人員。</div>`;
          return;
        }
        let html = `<div class="lane-board">`;
        for (const [laneKey, lane] of lanes) {
          const count = lane.people.length;
          const tagClass = count > Number(els.tlTarget.value) ? "hot" : count < Math.max(2, Number(els.tlTarget.value) - 2) ? "warn" : "";
          html += `<section class="lane" data-lane="${escapeHtml(laneKey)}">
            <div class="lane-head">
              <div><strong>${escapeHtml(lane.plannedTl)}</strong><br><span style="color:var(--muted);font-size:.78rem">${escapeHtml(lane.center)} · ${escapeHtml(lane.asName || "Unassigned AS")}</span></div>
              <span class="tag ${tagClass}">${count}</span>
            </div>
            <div class="lane-body">`;
          for (const person of lane.people) {
            html += `<span class="chip draggable ${valid(person.terminationDate) ? "terminated" : ""}" draggable="true" data-person="${escapeHtml(rowKey(person))}">${escapeHtml(person.therapist)}</span>`;
          }
          html += `</div></section>`;
        }
        html += `</div>`;
        els.planView.innerHTML = html;
        bindDrag();
      }

      function bindDrag() {
        els.planView.querySelectorAll(".draggable").forEach(chip => {
          chip.addEventListener("dragstart", event => {
            event.dataTransfer.setData("text/plain", chip.dataset.person);
          });
        });
        els.planView.querySelectorAll(".lane").forEach(lane => {
          lane.addEventListener("dragover", event => {
            event.preventDefault();
            lane.classList.add("drag-over");
          });
          lane.addEventListener("dragleave", () => lane.classList.remove("drag-over"));
          lane.addEventListener("drop", event => {
            event.preventDefault();
            lane.classList.remove("drag-over");
            const key = event.dataTransfer.getData("text/plain");
            const parts = lane.dataset.lane.split("|");
            state.planAssignments.set(key, parts[3]);
            renderPlan();
            renderInsights();
          });
        });
      }

      function renderTable() {
        const rows = getPlanRows();
        if (!rows.length) {
          els.tableView.innerHTML = `<div class="empty">沒有資料。</div>`;
          return;
        }
        const body = rows.map(row => `<tr style="${valid(row.terminationDate) ? "background:#ffe2dd" : ""}">
          <td>${escapeHtml(row.brand)}</td>
          <td>${escapeHtml(row.center)}</td>
          <td>${escapeHtml(row.asName)}</td>
          <td>${escapeHtml(row.tlName || "Direct")}</td>
          <td>${escapeHtml(row.plannedTl)}</td>
          <td>${escapeHtml(row.therapist)}</td>
          <td>${escapeHtml(row.terminationDate)}</td>
          <td>${escapeHtml(row.position)}</td>
          <td>${escapeHtml(row.highPo)}</td>
          <td>${escapeHtml(row.salesMtd)}</td>
          <td>${escapeHtml(row.acbCurrent)}</td>
          <td>${escapeHtml(row.acbNetChange)}</td>
          <td>${escapeHtml(row.hiresOnboarded)}</td>
          <td>${escapeHtml(row.hiresPending)}</td>
        </tr>`).join("");
        els.tableView.innerHTML = `<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:.9rem">
          <thead><tr>
            ${["Brand","Center","AS","Current TL","Planned TL","Therapist","Last day","Position","High Po","MTD Sales%","ACB Current","ACB Net Change","Hires Onboarded","Hires Pending"].map(item => `<th style="text-align:left;padding:10px;border-bottom:1px solid var(--line);background:#fbfaf7">${item}</th>`).join("")}
          </tr></thead>
          <tbody>${body}</tbody>
        </table></div>`;
      }

      function renderInsights() {
        const rows = getPlanRows();
        const tlTarget = Number(els.tlTarget.value);
        const asTarget = Number(els.asTarget.value);
        const tlGroups = new Map();
        const asGroups = new Map();
        rows.forEach(row => {
          const tlKey = `${row.brand} · ${row.center} · ${row.asName || "Unassigned AS"} · ${row.plannedTl}`;
          const asKey = `${row.brand} · ${row.center} · ${row.asName || "Unassigned AS"}`;
          if (!tlGroups.has(tlKey)) tlGroups.set(tlKey, new Set());
          if (!asGroups.has(asKey)) asGroups.set(asKey, new Set());
          tlGroups.get(tlKey).add(row.therapist);
          asGroups.get(asKey).add(row.therapist);
        });
        const insights = [];
        for (const [key, people] of tlGroups) {
          if (people.size > tlTarget) insights.push({ type: "hot", title: `${key}`, text: `超出 TL 目標 1:${tlTarget}，多出 ${people.size - tlTarget} 人，可以考慮拆 team 或加 trainee TL。` });
          if (people.size <= Math.max(1, tlTarget - 4)) insights.push({ type: "warn", title: `${key}`, text: `低於理想 span，若地點相近可考慮合併或由 AS direct manage。` });
        }
        for (const [key, people] of asGroups) {
          if (people.size > asTarget) insights.push({ type: "hot", title: `${key}`, text: `AS 管理 ${people.size} 人，高過目標 1:${asTarget}，建議提升一位 TL 或拆中心責任。` });
        }
        const directCount = rows.filter(row => !valid(row.tlName) || row.plannedTl === "Direct").length;
        if (directCount) insights.unshift({ type: "warn", title: `${directCount} 位未有 TL / Direct report`, text: "可以用 Drag Plan 將人拖入合適 TL，或保留 AS direct manage。" });
        if (!insights.length) insights.push({ type: "", title: "暫時沒有明顯風險", text: "現時篩選範圍內 team size 接近你設定的目標。" });
        els.insights.innerHTML = insights.slice(0, 12).map(item => `<div class="insight">
          <strong><span class="tag ${item.type}">${item.type === "hot" ? "Over" : item.type === "warn" ? "Check" : "OK"}</span> ${escapeHtml(item.title)}</strong>
          <p>${escapeHtml(item.text)}</p>
        </div>`).join("");
      }

      function syncAll() {
        refreshFilters();
        applyFilters();
        renderMetrics();
        renderChart();
        renderPlan();
        renderTable();
        renderInsights();
        updateView();
      }

      function updateView() {
        const view = state.currentView;
        els.chartView.classList.toggle("hidden", view !== "chart");
        els.planView.classList.toggle("hidden", view !== "plan");
        els.tableView.classList.toggle("hidden", view !== "table");
        els.resetPlanBtn.classList.toggle("hidden", view !== "plan");
        els.mainTitle.textContent = view === "chart" ? "Org Chart" : view === "plan" ? "Drag Plan" : "Planning Table";
        els.mainSubtitle.textContent = view === "chart" ? "按現有 Sheet 層級自動整理。" : view === "plan" ? "拖拉 therapist 去另一個 TL，右邊會即時計規劃提示。" : "匯出時會包含 Planned TL。";
        document.querySelectorAll(".segmented button").forEach(btn => btn.classList.toggle("active", btn.dataset.view === view));
      }

      function parsePasted(text) {
        const lines = clean(text).split(/\r?\n/).filter(Boolean);
        return lines.map(line => {
          const delimiter = line.includes("\t") ? "\t" : ",";
          return line.split(delimiter).map(clean);
        });
      }

      function exportCsv() {
        const header = ["Brand","Center","AS","Current TL","Planned TL","Therapist","Last day","Position","High Po","MTD Sales%","ACB Current","ACB Net Change","Hires Onboarded","Hires Pending"];
        const rows = getPlanRows().map(row => [row.brand, row.center, row.asName, row.tlName || "Direct", row.plannedTl, row.therapist, row.terminationDate, row.position, row.highPo, row.salesMtd, row.acbCurrent, row.acbNetChange, row.hiresOnboarded, row.hiresPending]);
        const csv = [header, ...rows].map(row => row.map(value => `"${clean(value).replaceAll('"', '""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "org-chart-plan.csv";
        link.click();
        URL.revokeObjectURL(url);
      }

      [els.brandFilter, els.centerFilter, els.asFilter].forEach(select => {
        select.addEventListener("change", () => {
          applyFilters();
          renderMetrics();
          renderChart();
          renderPlan();
          renderTable();
          renderInsights();
        });
      });

      els.searchInput.addEventListener("input", () => {
        applyFilters();
        renderMetrics();
        renderChart();
        renderPlan();
        renderTable();
        renderInsights();
      });

      els.tlTarget.addEventListener("input", () => {
        els.tlTargetValue.textContent = `1:${els.tlTarget.value}`;
        renderChart();
        renderPlan();
        renderInsights();
      });

      els.asTarget.addEventListener("input", () => {
        els.asTargetValue.textContent = `1:${els.asTarget.value}`;
        renderInsights();
      });

      document.querySelectorAll(".segmented button").forEach(button => {
        button.addEventListener("click", () => {
          state.currentView = button.dataset.view;
          updateView();
        });
      });

      els.refreshBtn.addEventListener("click", loadFromAppsScript);
      els.printBtn.addEventListener("click", () => window.print());
      els.exportBtn.addEventListener("click", exportCsv);
      els.sideToggle.addEventListener("click", () => {
        const collapsed = els.appLayout.classList.toggle("left-collapsed");
        els.sideToggle.textContent = collapsed ? "≡" : "×";
        els.sideToggle.setAttribute("aria-expanded", String(!collapsed));
      });
      els.insightToggle.addEventListener("click", () => {
        const collapsed = els.insightPanel.classList.toggle("collapsed");
        els.contentGrid.classList.toggle("insights-collapsed", collapsed);
        els.insightToggle.textContent = collapsed ? "+" : "−";
        els.insightToggle.setAttribute("aria-expanded", String(!collapsed));
      });
      els.resetPlanBtn.addEventListener("click", () => {
        state.planAssignments.clear();
        renderPlan();
        renderTable();
        renderInsights();
      });
      els.pasteBtn.addEventListener("click", () => {
        const parsed = parsePasted(els.pasteBox.value);
        const rows = normalizeRows(parsed);
        if (!rows.length) {
          setStatus("貼上資料未能辨認。請按 Brand, Center, AS, TL, Therapist 次序貼上。", "error");
          return;
        }
        state.rawRows = rows;
        state.dataSource = "pasted";
        state.planAssignments.clear();
        setStatus(`已套用貼上資料：${rows.length} 位有效人員。`, "live");
        syncAll();
      });

      loadFromAppsScript();
    </script>
  </body>
</html>
