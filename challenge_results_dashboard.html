<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fibolucci 每日挑戰戰績榜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #07020f;
      --bg-2: #1d0b24;
      --panel: rgba(32, 13, 34, 0.76);
      --panel-solid: #190b23;
      --accent: #ff9f43;
      --accent-2: #ffd078;
      --rose: #ff5f9e;
      --mint: #ffe1a3;
      --text: #fff7e9;
      --muted: #d9bfa9;
      --line: rgba(255, 184, 96, 0.28);
      --good: #ffe08a;
      --warn: #ff8a5c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 122, 58, 0.25), transparent 34%),
        radial-gradient(circle at 76% 10%, rgba(255, 64, 139, 0.18), transparent 28%),
        radial-gradient(circle at 55% 44%, rgba(255, 190, 86, 0.12), transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
    }

    .container {
      width: min(1220px, 94vw);
      margin: 24px auto 36px;
    }

    .hero {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(120deg, rgba(255, 144, 48, 0.12), rgba(9, 5, 20, 0.94)),
        radial-gradient(circle at 73% 42%, rgba(255, 186, 78, 0.23), transparent 32%);
      box-shadow: 0 16px 42px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255, 210, 129, 0.75) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255, 90, 150, 0.5) 0 1px, transparent 2px);
      background-size: 92px 92px, 143px 143px;
      opacity: 0.35;
      pointer-events: none;
    }

    .hero-stage {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(300px, 0.98fr);
      gap: 22px;
      align-items: center;
    }

    .hero h1 {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(26px, 4vw, 46px);
      letter-spacing: 1px;
      line-height: 1.15;
      color: #fff4cf;
      text-shadow: 0 0 18px rgba(255, 185, 93, 0.64);
    }

    .hero-kicker {
      display: inline-block;
      margin-bottom: 8px;
      color: #ffd078;
      font-size: 13px;
      font-weight: 900;
    }

    .hero p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(14px, 2.1vw, 19px);
    }

    .period {
      margin-top: 10px;
      display: inline-block;
      border: 1px solid rgba(255, 214, 111, 0.45);
      border-radius: 999px;
      padding: 6px 12px;
      color: #ffe8a8;
      font-size: 12px;
      letter-spacing: 0.5px;
      background: rgba(255, 214, 111, 0.08);
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    .connection-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(255, 214, 111, 0.34);
      border-radius: 999px;
      padding: 6px 12px;
      color: #ffe8a8;
      background: rgba(16, 8, 20, 0.58);
      font-size: 12px;
      font-weight: 800;
    }

    .connection-status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffd078;
      box-shadow: 0 0 12px rgba(255, 208, 120, 0.7);
    }

    .connection-status.ok::before { background: #69ffba; box-shadow: 0 0 12px rgba(105, 255, 186, 0.7); }
    .connection-status.error::before { background: #ff5f7e; box-shadow: 0 0 12px rgba(255, 95, 126, 0.7); }
    .connection-status.loading::before { animation: pulseDot 1s ease-in-out infinite; }

    .key-visual {
      min-height: 310px;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background:
        radial-gradient(circle at 58% 52%, rgba(255, 202, 110, 0.28), transparent 7%),
        radial-gradient(circle at 18% 74%, rgba(255, 160, 77, 0.22), transparent 18%),
        radial-gradient(circle at 62% 50%, rgba(255, 91, 155, 0.18), transparent 42%),
        linear-gradient(135deg, rgba(31, 9, 24, 0.7), rgba(8, 5, 18, 0.62));
      border: 1px solid rgba(255, 184, 96, 0.22);
    }

    .spiral {
      position: absolute;
      width: 210px;
      height: 210px;
      left: 40%;
      top: 17%;
      border-radius: 50%;
      background:
        conic-gradient(from 120deg, transparent 0 28%, rgba(255, 213, 135, 0.95), transparent 62%),
        radial-gradient(circle, transparent 0 40%, rgba(255, 177, 79, 0.32) 41% 42%, transparent 44% 100%);
      filter: drop-shadow(0 0 18px rgba(255, 177, 79, 0.65));
      animation: slowSpin 18s linear infinite;
    }

    .spiral::after {
      content: "";
      position: absolute;
      inset: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255, 210, 129, 0.68);
      box-shadow: 0 0 20px rgba(255, 177, 79, 0.58);
    }

    .phone-glow {
      position: absolute;
      left: 8%;
      bottom: 12%;
      width: 102px;
      height: 148px;
      border-radius: 20px;
      transform: rotate(-8deg);
      background: linear-gradient(160deg, #26102d, #080511);
      border: 1px solid rgba(255, 212, 132, 0.44);
      box-shadow: 0 0 38px rgba(255, 168, 70, 0.44), inset 0 0 24px rgba(255, 108, 80, 0.16);
    }

    .phone-glow::before {
      content: "gratus";
      position: absolute;
      inset: 20px 12px auto;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #ffe7b2;
      font-weight: 900;
      background: linear-gradient(135deg, rgba(255, 151, 50, 0.86), rgba(255, 82, 141, 0.7));
    }

    .phone-glow::after {
      content: "1+2";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 32px;
      text-align: center;
      color: #ffd078;
      font-family: "Orbitron", sans-serif;
      font-size: 26px;
      font-weight: 900;
    }

    .node {
      position: absolute;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #2c1021;
      font-weight: 900;
      background: radial-gradient(circle at 35% 30%, #fff5d6, #ffb24f 62%, #ff6b8f);
      box-shadow: 0 0 24px rgba(255, 184, 96, 0.68);
      border: 2px solid rgba(255, 233, 180, 0.8);
    }

    .node.small { width: 38px; height: 38px; font-size: 12px; }
    .node:nth-of-type(3) { left: 33%; top: 17%; }
    .node:nth-of-type(4) { left: 68%; top: 11%; }
    .node:nth-of-type(5) { left: 78%; top: 41%; }
    .node:nth-of-type(6) { left: 55%; bottom: 12%; }
    .node:nth-of-type(7) { left: 29%; bottom: 24%; }
    .node:nth-of-type(8) { left: 84%; bottom: 15%; }

    .visual-tag {
      position: absolute;
      right: 18px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 184, 96, 0.48);
      color: #ffe8a8;
      background: rgba(14, 6, 20, 0.68);
      box-shadow: 0 0 18px rgba(255, 153, 61, 0.18);
      font-size: 12px;
      font-weight: 900;
    }

    .visual-tag.one { top: 26px; }
    .visual-tag.two { top: 84px; }
    .visual-tag.three { bottom: 28px; }

    @keyframes slowSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulseDot {
      50% { transform: scale(1.45); opacity: 0.55; }
    }

    .summary-grid {
      position: relative;
      z-index: 1;
      margin-top: 18px;
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }

    .kpi {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(4px);
      box-shadow: inset 0 0 18px rgba(255, 176, 75, 0.06);
    }

    .kpi .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: #dbc9ff;
    }

    .kpi .value {
      margin-top: 8px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(22px, 3.3vw, 34px);
      color: #fff;
    }

    .kpi .sub {
      font-size: 12px;
      color: #ffd078;
      margin-top: 3px;
    }

    .section-title {
      margin: 24px 0 10px;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(20px, 3vw, 30px);
      color: #ffe8a8;
      letter-spacing: 0.8px;
    }

    .reward-panel {
      margin-top: 18px;
      border: 1px solid rgba(255, 214, 111, 0.36);
      border-radius: 14px;
      padding: 16px;
      background: linear-gradient(120deg, rgba(255, 159, 67, 0.16), rgba(31, 9, 24, 0.88));
    }

    .reward-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .reward-head h2 {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: 22px;
      color: #ffe8a8;
    }

    .reward-head span { color: var(--muted); font-size: 13px; }
    .reward-grid { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 10px; }
    .reward-card { border: 1px solid rgba(255, 214, 111, 0.28); border-radius: 10px; padding: 12px; background: rgba(9, 6, 28, 0.72); box-shadow: inset 0 0 20px rgba(255, 214, 111, 0.08); }
    .reward-name { font-family: "Orbitron", sans-serif; font-size: 24px; color: #fff4cf; }
    .reward-criteria { margin-top: 4px; color: #dfd3ff; font-size: 12px; }
    .reward-count { margin-top: 10px; color: #ffd078; font-weight: 800; }

    .filter-wrap {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      background: linear-gradient(160deg, rgba(25, 11, 35, 0.96), rgba(18, 7, 22, 0.96));
      box-shadow: inset 0 0 28px rgba(255, 151, 50, 0.12);
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #d9ceff;
      margin-bottom: 6px;
      letter-spacing: 0.8px;
    }

    select {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255, 184, 96, 0.36);
      background: rgba(18, 8, 24, 0.92);
      color: #fff;
      padding: 10px;
      font-size: 14px;
      outline: none;
    }

    .board-wrap { display: grid; gap: 14px; }
    .player-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: rgba(18, 8, 24, 0.94); box-shadow: 0 12px 28px rgba(0,0,0,0.22), inset 0 0 20px rgba(255, 159, 67, 0.05); }
    .player-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
    .calendar-grid { display: grid; grid-template-columns: repeat(6, minmax(78px, 1fr)); gap: 8px; }
    .weekday { padding: 6px 4px; text-align: center; color: #ffe8a8; font-size: 11px; font-weight: 800; border-bottom: 1px solid rgba(255, 214, 111, 0.24); }
    .daybox { border: 1px solid rgba(255, 184, 96, 0.3); border-radius: 10px; padding: 8px; background: rgba(35, 13, 31, 0.84); min-height: 94px; }
    .daybox.blank { visibility: hidden; }
    .daynum { font-size: 11px; color: #d5c7ff; }
    .daily-line { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; font-size: 12px; color: #f4edff; }
    .daily-label { color: #e7c2aa; }
    .daily-mark { color: #ffd078; font-weight: 800; }
    .empty { color: #806b72; }
    .level-badge { color: #ffe8a8; font-weight: 900; }

    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .pill.done { background: rgba(89,255,176,0.2); color: var(--good); }
    .pill.near { background: rgba(255,217,120,0.2); color: var(--warn); }

    .detail {
      margin-top: 12px;
      border: 1px dashed rgba(186, 152, 255, 0.45);
      border-radius: 12px;
      padding: 12px;
      color: #e7d9ff;
      font-size: 13px;
      background: rgba(15, 10, 38, 0.8);
      line-height: 1.6;
    }

    @media (max-width: 860px) {
      .hero-stage { grid-template-columns: 1fr; }
      .key-visual { min-height: 260px; }
      .filter-row { grid-template-columns: 1fr; }
      .reward-grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    }

    @media (max-width: 540px) {
      .container { width: min(100% - 24px, 1220px); margin-top: 14px; }
      .hero { padding: 18px; }
      .calendar-grid { grid-template-columns: repeat(6, minmax(48px, 1fr)); gap: 5px; }
      .weekday { font-size: 10px; padding-inline: 2px; }
      .daybox { min-height: 86px; padding: 6px; }
      .daily-line { font-size: 11px; gap: 4px; }
      .visual-tag { right: 10px; font-size: 10px; padding: 7px 10px; }
      .reward-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <div class="hero-stage">
        <div>
          <div class="hero-kicker">美力連結任務｜每日 1 Head + 2 Tail</div>
          <h1>Fibolucci 每日挑戰戰績榜</h1>
          <p>每一次分享都在擴大信任網絡。追蹤全隊戰績、連勝獎章，讓每位美容師像闖關玩家一樣累積影響力。</p>
          <div class="status-row">
            <div id="periodLine" class="period"></div>
            <div id="connectionStatus" class="connection-status loading">連線檢查中</div>
          </div>
        </div>
        <div class="key-visual" aria-hidden="true">
          <div class="spiral"></div>
          <div class="phone-glow"></div>
          <div class="node">A</div>
          <div class="node small">B</div>
          <div class="node small">C</div>
          <div class="node">D</div>
          <div class="node small">E</div>
          <div class="node small">F</div>
          <div class="visual-tag one">BEAUTY SHARED</div>
          <div class="visual-tag two">TRUST BUILT</div>
          <div class="visual-tag three">CONNECTIONS GROW</div>
        </div>
      </div>
      <div id="summaryGrid" class="summary-grid"></div>
    </section>

    <section class="reward-panel">
      <div class="reward-head">
        <h2>獎章任務</h2>
        <span>連續達成 Head + Tail 即可升級領獎</span>
      </div>
      <div id="rewardGrid" class="reward-grid"></div>
    </section>

    <h2 class="section-title">玩家闖關日曆</h2>

    <section class="filter-wrap">
      <div class="filter-row">
        <div class="field">
          <label for="brandFilter">品牌</label>
          <select id="brandFilter"></select>
        </div>
        <div class="field">
          <label for="therapistFilter">美容師 / 玩家</label>
          <select id="therapistFilter"></select>
        </div>
      </div>

      <div id="boardWrap" class="board-wrap"></div>

      <div id="detailBox" class="detail">點選玩家卡，即可查看連勝、獎章及 Head / Tail 明細。</div>
    </section>
  </div>

  <script>
    const APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwWlQIj3BJjtubusxrHvJRmq_hljPsGe2hftMHxzpHFeumte5TXXOKYeu1NSjkfvVV3/exec";
    let rows = [];

    const brandFilter = document.getElementById("brandFilter");
    const therapistFilter = document.getElementById("therapistFilter");
    const boardWrap = document.getElementById("boardWrap");
    const summaryGrid = document.getElementById("summaryGrid");
    const rewardGrid = document.getElementById("rewardGrid");
    const detailBox = document.getElementById("detailBox");
    const periodLine = document.getElementById("periodLine");
    const connectionStatus = document.getElementById("connectionStatus");

    let challengeStart = new Date("2026-05-22T00:00:00");
    let challengeEnd = new Date("2026-06-17T23:59:59");

    function num(v) { return Number(v) || 0; }

    function formatDate(d) {
      return d.toLocaleDateString("en-CA", { year: "numeric", month: "2-digit", day: "2-digit" });
    }

    function toYmd(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getCompletionPercent(r) {
      const target = 63;
      return Math.round((num(r.head) + num(r.tail)) / target * 100);
    }

    function buildSummary(data) {
      const therapistCount = data.length;
      const totalHead = data.reduce((a, r) => a + num(r.head), 0);
      const totalTail = data.reduce((a, r) => a + num(r.tail), 0);
      const totalAction = totalHead + totalTail;
      const avgRate = therapistCount ? Math.round(data.reduce((a, r) => a + getCompletionPercent(r), 0) / therapistCount) : 0;
      const fullComplete = data.filter(r => num(r.head) >= 21 && num(r.tail) >= 42).length;
      const totalDays = challengeDays().length;

      const cards = [
        { label: "參賽玩家", value: therapistCount, sub: "目前顯示人數" },
        { label: "Head 戰績", value: totalHead, sub: "每人目標 21" },
        { label: "Tail 戰績", value: totalTail, sub: "每人目標 42" },
        { label: "總行動值", value: totalAction, sub: "Head + Tail" },
        { label: "平均完成率", value: avgRate + "%", sub: "依目前篩選計算" },
        { label: "滿分通關", value: fullComplete, sub: "達成 21 Head + 42 Tail" },
        { label: "開店挑戰日", value: totalDays, sub: "2026/05/22 至 2026/06/17，星期日不計" }
      ];

      summaryGrid.innerHTML = cards.map(c => `
        <div class="kpi">
          <div class="label">${c.label}</div>
          <div class="value">${c.value}</div>
          <div class="sub">${c.sub}</div>
        </div>
      `).join("");
    }

    function renderPeriod() {
      periodLine.textContent = `挑戰期間：${formatDate(challengeStart)} 至 ${formatDate(challengeEnd)}（星期日店休不計）`;
    }

    function setConnectionStatus(state, message) {
      connectionStatus.className = `connection-status ${state}`;
      connectionStatus.textContent = message;
    }

    function uniqueBrands() {
      return [...new Set(rows.map(r => r.brand))].sort();
    }

    function uniqueTherapists(brandValue) {
      const scoped = brandValue === "ALL" ? rows : rows.filter(r => r.brand === brandValue);
      return [...new Set(scoped.map(r => r.therapist))].sort();
    }

    function fillFilters() {
      brandFilter.innerHTML = ["ALL", ...uniqueBrands()].map(v => `<option value="${v}">${v === "ALL" ? "全部品牌" : v}</option>`).join("");
      refillTherapists();
    }

    function refillTherapists() {
      const list = uniqueTherapists(brandFilter.value || "ALL");
      therapistFilter.innerHTML = ["ALL", ...list].map(v => `<option value="${v}">${v === "ALL" ? "全部玩家" : v}</option>`).join("");
    }

    function getFilteredRows() {
      const b = brandFilter.value;
      const t = therapistFilter.value;
      return rows.filter(r => (b === "ALL" || r.brand === b) && (t === "ALL" || r.therapist === t));
    }

    function challengeDays() {
      const days = [];
      const d = new Date(challengeStart.getTime());
      while (d <= challengeEnd) {
        if (d.getDay() !== 0) {
          days.push(new Date(d.getTime()));
        }
        d.setDate(d.getDate() + 1);
      }
      return days;
    }

    function shopWeekdayIndex(d) {
      return d.getDay() - 1;
    }

    function calendarCells(days) {
      if (!days.length) return [];

      const cells = [];
      const firstOffset = shopWeekdayIndex(days[0]);
      for (let i = 0; i < firstOffset; i++) {
        cells.push(null);
      }

      days.forEach((d) => cells.push(d));

      while (cells.length % 6 !== 0) {
        cells.push(null);
      }

      return cells;
    }

    function buildSequentialDailyCounts(total, maxPerDay) {
      const map = {};
      let remaining = num(total);
      challengeDays().forEach((d) => {
        if (remaining <= 0) return;
        const count = Math.min(maxPerDay, remaining);
        map[toYmd(d)] = count;
        remaining -= count;
      });
      return map;
    }

    function getHeadMap(r) {
      if (r.headByDate) return r.headByDate;
      return buildSequentialDailyCounts(r.head, 1);
    }

    function getTailMap(r) {
      if (r.tailByDate) return r.tailByDate;
      return buildSequentialDailyCounts(r.tail, 2);
    }

    function bestSuccessStreak(r) {
      const headByDate = getHeadMap(r);
      const tailByDate = getTailMap(r);
      let best = 0;
      let current = 0;

      challengeDays().forEach((d) => {
        const key = toYmd(d);
        const isSuccess = num(headByDate[key]) >= 1 && num(tailByDate[key]) >= 2;
        current = isSuccess ? current + 1 : 0;
        best = Math.max(best, current);
      });

      return best;
    }

    function rewardLevel(streak) {
      if (streak >= 21) return "D";
      if (streak >= 14) return "C";
      if (streak >= 7) return "B";
      if (streak >= 3) return "A";
      return "-";
    }

    function renderRewards(data) {
      const criteria = [
        { name: "銅章", days: 3, level: "A" },
        { name: "銀章", days: 7, level: "B" },
        { name: "金章", days: 14, level: "C" },
        { name: "皇冠章", days: 21, level: "D" }
      ];

      rewardGrid.innerHTML = criteria.map((item) => {
        const winners = data.filter(r => bestSuccessStreak(r) >= item.days).length;
        return `<div class="reward-card">
          <div class="reward-name">${item.level}</div>
          <div class="reward-criteria">${item.name}｜連續 ${item.days} 個開店日達標</div>
          <div class="reward-count">${winners} 位玩家已解鎖</div>
        </div>`;
      }).join("");
    }

    function renderTable(filtered) {
      if (!filtered.length) {
        boardWrap.innerHTML = `<div class="detail">目前篩選沒有玩家資料。</div>`;
        detailBox.textContent = "尚未選擇玩家。";
        return;
      }

      const days = challengeDays();
      const weekdays = ["一", "二", "三", "四", "五", "六"].map(day => `<div class="weekday">星期${day}</div>`).join("");
      const cells = calendarCells(days);
      boardWrap.innerHTML = filtered.map((r, i) => {
        const headByDate = getHeadMap(r);
        const tailByDate = getTailMap(r);
        const boxes = cells.map((d) => {
          if (!d) return `<div class="daybox blank"></div>`;
          const key = toYmd(d);
          const headCount = num(headByDate[key]);
          const tailCount = num(tailByDate[key]);
          const headOk = headCount >= 1;
          const tailOk = tailCount >= 2;
          return `<div class="daybox">
            <div class="daynum">${(d.getMonth() + 1)}/${d.getDate()}</div>
            <div class="daily-line"><span class="daily-label">Head</span><span class="daily-mark ${headOk ? "" : "empty"}">${headOk ? "✓" : "○"} ${headCount}/1</span></div>
            <div class="daily-line"><span class="daily-label">Tail</span><span class="daily-mark ${tailOk ? "" : "empty"}">${tailOk ? "✓" : "○"} ${tailCount}/2</span></div>
          </div>`;
        }).join("");
        const streak = bestSuccessStreak(r);
        const centerText = r.center ? ` · ${r.center}` : "";
        return `<div class="player-card" data-index="${i}">
          <div class="player-head"><strong>${r.therapist}</strong><span>${r.brand}${centerText} · 完成率 ${getCompletionPercent(r)}% · <span class="level-badge">獎章 ${rewardLevel(streak)}</span></span></div>
          <div class="calendar-grid">${weekdays}${boxes}</div>
        </div>`;
      }).join("");

      Array.from(boardWrap.querySelectorAll(".player-card")).forEach((card) => {
        card.addEventListener("click", () => {
          const idx = Number(card.dataset.index);
          const r = filtered[idx];
          const streak = bestSuccessStreak(r);
          const centerText = r.center ? ` · ${r.center}` : "";
          detailBox.innerHTML = `<strong>${r.therapist}</strong> · ${r.brand}${centerText}<br>
            完成率：${getCompletionPercent(r)}%（${num(r.head) + num(r.tail)}/63）<br>
            目前獎章：${rewardLevel(streak)}｜最佳連勝：${streak} 個開店日<br>
            Head：${r.head}/21｜Tail：${r.tail}/42<br>
            Head 有紀錄日：${Object.keys(getHeadMap(r)).length}｜Tail 有紀錄日：${Object.keys(getTailMap(r)).length}<br>
            戰況提示：${r.notes}`;
        });
      });
    }

    async function loadFromAppsScript() {
      if (!APPS_SCRIPT_WEBAPP_URL || APPS_SCRIPT_WEBAPP_URL.includes("PASTE_YOUR_APPS_SCRIPT_WEBAPP_URL_HERE")) {
        rows = [];
        setConnectionStatus("error", "未設定 Apps Script URL");
        return false;
      }

      setConnectionStatus("loading", "正在連接 Apps Script");

      try {
        const res = await fetch(`${APPS_SCRIPT_WEBAPP_URL}?action=challengeData`);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();
        if (!data.ok) {
          throw new Error(data.error || "Apps Script 回傳錯誤");
        }
        if (!Array.isArray(data.rows)) {
          throw new Error("Apps Script 未回傳 rows 資料");
        }

        if (data.challengeStart) challengeStart = new Date(`${data.challengeStart}T00:00:00`);
        if (data.challengeEnd) challengeEnd = new Date(`${data.challengeEnd}T23:59:59`);

        rows = data.rows.map(r => {
          const headByDate = r.headByDate || {};
          const tailByDate = r.tailByDate || {};
          const head = Object.values(headByDate).reduce((a, v) => a + num(v), 0);
          const tail = Object.values(tailByDate).reduce((a, v) => a + num(v), 0);
          return {
            therapist: r.therapist,
            brand: r.brand,
            center: r.center || "",
            head,
            tail,
            notes: `已連接 Google Sheet。Head 累計：${head}；Tail 累計：${tail}`,
            headByDate,
            tailByDate
          };
        });

        setConnectionStatus("ok", `已連接 Apps Script｜${rows.length} 位玩家`);
        return true;
      } catch (error) {
        rows = [];
        setConnectionStatus("error", `連線失敗：${error.message}`);
        return false;
      }
    }

    function refresh() {
      const data = getFilteredRows();
      buildSummary(data);
      renderRewards(data);
      renderTable(data);
    }

    brandFilter.addEventListener("change", () => {
      refillTherapists();
      therapistFilter.value = "ALL";
      refresh();
    });

    therapistFilter.addEventListener("change", refresh);

    (async function init() {
      await loadFromAppsScript();
      fillFilters();
      renderPeriod();
      refresh();
    })();
  </script>
</body>
</html>
