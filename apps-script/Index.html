<!doctype html>
<html>
  <head>
    <base target="_top">
    <style>
      :root {
        --ink: #17201b;
        --muted: #68736d;
        --paper: #f6f0e6;
        --panel: #fffaf1;
        --line: #ddcfbb;
        --red: #c93b35;
        --teal: #0b6f68;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Avenir Next", "Gill Sans", "Trebuchet MS", sans-serif;
        background:
          linear-gradient(135deg, rgba(201, 59, 53, 0.13), transparent 34%),
          linear-gradient(225deg, rgba(11, 111, 104, 0.16), transparent 34%),
          repeating-linear-gradient(90deg, rgba(23, 32, 27, 0.035) 0 1px, transparent 1px 72px),
          var(--paper);
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(300px, 0.78fr) minmax(620px, 1.45fr);
        gap: 28px;
        min-height: 100vh;
        padding: 34px;
      }

      .entry,
      .results {
        background: rgba(255, 250, 241, 0.92);
        border: 1px solid rgba(221, 207, 187, 0.95);
        box-shadow: 0 24px 70px rgba(45, 35, 24, 0.14);
      }

      .entry {
        padding: 42px;
      }

      .results {
        padding: 26px;
        overflow: hidden;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--teal);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1,
      h2 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
      }

      h1 {
        font-size: 50px;
        line-height: 1;
      }

      h2 {
        font-size: 30px;
      }

      .lede {
        color: var(--muted);
        line-height: 1.55;
      }

      label {
        display: block;
        margin: 22px 0 10px;
        color: var(--muted);
        font-weight: 700;
      }

      textarea,
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px;
        color: var(--ink);
        background: #fffdf8;
        font: inherit;
      }

      button {
        display: inline-flex;
        justify-content: center;
        min-height: 44px;
        margin-top: 12px;
        border: 0;
        border-radius: 6px;
        padding: 0 18px;
        color: white;
        background: var(--red);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      .ghost {
        color: var(--teal);
        border: 1px solid rgba(11, 111, 104, 0.35);
        background: transparent;
      }

      .full {
        width: 100%;
      }

      .message,
      .status {
        color: var(--muted);
        font-size: 13px;
      }

      .table-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fffdf8;
      }

      table {
        width: 100%;
        min-width: 1120px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 13px;
        border-bottom: 1px solid #eadfce;
        text-align: left;
        vertical-align: top;
        font-size: 13px;
      }

      th {
        color: #5f5141;
        background: #f2e7d6;
        font-size: 11px;
        text-transform: uppercase;
      }

      .metric {
        font-weight: 800;
      }

      .sub,
      .change {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 980px) {
        .shell {
          grid-template-columns: 1fr;
          padding: 18px;
        }

        h1 {
          font-size: 38px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="entry">
        <p class="eyebrow">Xiaohongshu tracker</p>
        <h1>Sheet-native hourly tracking.</h1>
        <p class="lede">This web app runs inside Google Apps Script, writes directly into your Sheet, and refreshes tracked posts every hour.</p>

        <label for="token">Apify token</label>
        <input id="token" type="password" placeholder="apify_api_..." />
        <button class="full" onclick="saveToken()">Save token</button>

        <label for="url">Post URL or note ID</label>
        <textarea id="url" rows="5" placeholder="https://www.xiaohongshu.com/explore/640dd4e2000000001203d865"></textarea>
        <button class="full" onclick="addTrack()">Start tracking</button>
        <p id="message" class="message"></p>
      </section>

      <section class="results">
        <div class="table-head">
          <div>
            <p class="eyebrow">Live results</p>
            <h2>Hourly performance table</h2>
          </div>
          <button class="ghost" onclick="refreshAll()">Refresh now</button>
        </div>
        <p id="status" class="status">Loading...</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Post</th>
                <th>KOL</th>
                <th>Likes</th>
                <th>Comments</th>
                <th>Saves</th>
                <th>Shares</th>
                <th>Hourly</th>
                <th>Daily</th>
                <th>Last check</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      function boot() {
        google.script.run.withSuccessHandler(render).withFailureHandler(showError).setup();
      }

      function saveToken() {
        const token = document.querySelector('#token').value;
        setMessage('Saving token...');
        google.script.run.withSuccessHandler(() => {
          document.querySelector('#token').value = '';
          setMessage('Token saved.');
          boot();
        }).withFailureHandler(showError).saveApifyToken(token);
      }

      function addTrack() {
        const url = document.querySelector('#url').value;
        setMessage('Checking post...');
        google.script.run.withSuccessHandler((data) => {
          document.querySelector('#url').value = '';
          setMessage('Tracking started.');
          render(data);
        }).withFailureHandler(showError).addTrack(url);
      }

      function refreshAll() {
        setMessage('Refreshing tracked posts...');
        google.script.run.withSuccessHandler(() => boot()).withFailureHandler(showError).refreshAllTrackedPosts();
      }

      function render(data) {
        document.querySelector('#status').textContent = data.hasToken
          ? 'Apify token saved. Hourly trigger is active.'
          : 'Save your Apify token before adding posts.';

        const rows = data.tracks || [];
        document.querySelector('#rows').innerHTML = rows.length
          ? rows.map(renderTrack).join('')
          : '<tr><td colspan="10">No posts tracked yet.</td></tr>';
      }

      function renderTrack(track) {
        const latest = track.latest || {};
        return `
          <tr>
            <td>
              <strong>${escapeHtml(latest.title || track.note_id)}</strong>
              <span class="sub">${escapeHtml(track.note_id || '')}</span>
            </td>
            <td>
              <strong>${escapeHtml(latest.kol_name || '-')}</strong>
              <span class="sub">Red ID ${escapeHtml(latest.red_id || '-')}</span>
            </td>
            <td class="metric">${num(latest.likes)}</td>
            <td class="metric">${num(latest.comments)}</td>
            <td class="metric">${num(latest.saves)}</td>
            <td class="metric">${num(latest.shares)}</td>
            <td>${change(latest, 'hourly')}</td>
            <td>${change(latest, 'daily')}</td>
            <td>${date(track.last_checked_at || latest.fetched_at)}</td>
            <td>${escapeHtml(track.status || '-')}<span class="sub">${escapeHtml(track.error || '')}</span></td>
          </tr>
        `;
      }

      function change(row, prefix) {
        const likes = row[`${prefix}_likes`];
        if (likes === '' || likes === undefined) return '<span class="sub">Baseline pending</span>';
        return `
          <span class="change">Likes ${signed(row[`${prefix}_likes`])}</span>
          <span class="change">Comments ${signed(row[`${prefix}_comments`])}</span>
          <span class="change">Saves ${signed(row[`${prefix}_saves`])}</span>
          <span class="change">Shares ${signed(row[`${prefix}_shares`])}</span>
        `;
      }

      function num(value) {
        return typeof value === 'number' ? value.toLocaleString() : '-';
      }

      function signed(value) {
        return typeof value === 'number' ? `${value >= 0 ? '+' : ''}${value.toLocaleString()}` : '-';
      }

      function date(value) {
        if (!value) return '-';
        return new Intl.DateTimeFormat(undefined, {
          month: 'short',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        }).format(new Date(value));
      }

      function setMessage(text) {
        document.querySelector('#message').textContent = text;
      }

      function showError(error) {
        setMessage(error.message || String(error));
      }

      function escapeHtml(value) {
        return String(value || '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      boot();
    </script>
  </body>
</html>
