<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>治療師內容入口</title>
    <link rel="stylesheet" href="./content-workbench.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">治療師入口</p>
        <h1>以員工編號登入</h1>
        <p>查看已分配內容並一鍵複製。</p>
      </header>

      <section class="panel">
        <h2>員工登入</h2>
        <div class="assign-row">
          <input id="staffLogin" placeholder="輸入員工編號" />
          <button id="loginBtn" type="button">載入我的內容</button>
          <a href="./content-workbench.html">返回管理後台</a>
        </div>
        <p id="portalStatus" class="status"></p>
        <div class="assign-row">
          <input id="dateFilter" type="date" />
          <select id="dateSort">
            <option value="asc">日期舊到新</option>
            <option value="desc">日期新到舊</option>
          </select>
          <button id="applyFilterBtn" type="button" class="ghost">套用日期篩選</button>
        </div>
      </section>

      <section class="panel">
        <h2>我被分配的內容</h2>
        <p><a href="https://drive.google.com/drive/u/2/folders/1NNiM2b4kTrQcH7FMU3hW-e1Wb9qPPhBl" target="_blank" rel="noopener noreferrer">開啟參考圖片資料夾</a></p>
        <div id="myContent" class="grid"></div>
      </section>
    </main>
    <script src="./therapist-portal.js"></script>
  </body>
</html>
